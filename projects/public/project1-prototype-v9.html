<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目一 · 单单位内部竞标 · 交互原型 v10</title>
<meta name="description" content="项目一销售攻关实训预览：NPC 对话、邀约和拜访使用真实 AI；预览会话暂不写入正式存档。">
<style>
:root{
  --bg:#eff3f9;--card:#ffffff;--text:#17223a;--muted:#68758c;--line:#dbe4f0;
  --blue:#2f6bff;--blue-deep:#2258dd;--cyan:#0ea5d9;--green:#15966f;--amber:#df9416;--red:#d94c60;
  --violet:#7b4bea;--gold:#d9951a;
  --glow-blue:rgba(47,107,255,.25);--glow-gold:rgba(223,148,22,.3);
  --shadow:0 10px 30px rgba(24,43,77,.08);--shadow-lg:0 18px 50px rgba(24,43,77,.13);
  --r:16px;--ease:cubic-bezier(.22,.9,.28,1);--spring:cubic-bezier(.34,1.56,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(1100px 520px at 12% -6%,rgba(47,107,255,.075),transparent 60%),
radial-gradient(900px 480px at 96% 6%,rgba(123,75,234,.055),transparent 55%),
radial-gradient(760px 440px at 50% 110%,rgba(14,165,217,.05),transparent 62%),
linear-gradient(180deg,#f5f8fd,#eef2f9 46%,#ebf0f8)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
::selection{background:rgba(47,107,255,.2)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#c3d1e6;border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#a9bcd8;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
.app{min-height:100vh;animation:pageIn .5s var(--ease) both}.shell{max-width:1680px;margin:auto;min-height:100vh}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateX(26px) scale(.95)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.08)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes floatFade{0%{opacity:0;transform:translateY(6px)}18%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
@keyframes apFlash{0%{box-shadow:0 0 0 0 var(--glow-gold)}100%{box-shadow:0 0 0 16px transparent}}

.topbar{height:68px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid rgba(214,226,242,.95);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:30;box-shadow:0 10px 26px rgba(30,47,77,.05)}
.brand{display:flex;gap:11px;align-items:center;min-width:360px}
.brand-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,#4f8dff 0%,#2b64ec 58%,#2250c8 100%);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 7px 18px rgba(47,107,255,.32),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(20,50,120,.35);transition:.3s var(--spring);position:relative;overflow:hidden}
.brand:hover .brand-icon{transform:translateY(-1px) rotate(-3deg) scale(1.04);box-shadow:0 10px 24px rgba(47,107,255,.42),inset 0 1px 0 rgba(255,255,255,.4)}
.brand h1{margin:0;font-size:16px;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:10px;color:var(--muted);letter-spacing:.08em}
.stage-pill{margin:auto;display:flex;align-items:center;gap:11px;padding:9px 15px;border:1px solid #dbe5f2;border-radius:12px;background:linear-gradient(180deg,#fdfefe,#f6f9fd);font-size:11px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 5px 16px rgba(24,43,77,.07)}
.stage-pill .phase-dots{display:inline-flex;gap:4px;margin-right:2px}
.stage-pill .pdot{width:7px;height:7px;border-radius:50%;background:#ccd9ec;transition:.3s var(--ease)}
.stage-pill .pdot.done{background:#2b64ec;box-shadow:0 0 5px rgba(47,107,255,.45)}
.stage-pill .pdot.cur{background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.55);animation:pulseDot 2.2s ease-in-out infinite}
.stage-pill .sep{width:1px;height:16px;background:#dfe7f2}
.stage-pill .ap{color:#a06a10;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;background:linear-gradient(180deg,#fff8e8,#fdf0cf);border:1px solid rgba(223,148,22,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.stage-pill .ap strong{font-size:13px;color:#8a5a08}
.ap.spent-flash{animation:apFlash .6s ease-out}
.float-ap{position:fixed;z-index:300;font-size:13px;font-weight:900;color:#c07f10;pointer-events:none;animation:floatFade 1s var(--ease) both;text-shadow:0 1px 0 rgba(255,255,255,.8),0 0 12px rgba(245,185,66,.45)}
.top-actions{min-width:360px;display:flex;justify-content:flex-end;gap:8px}
.btn{position:relative;overflow:hidden;border:1px solid #d5deeb;background:linear-gradient(180deg,#ffffff,#f5f8fc);color:var(--text);border-radius:10px;padding:9px 13px;font-size:11px;font-weight:800;transition:.22s var(--ease);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(24,43,77,.05)}
.btn:before{content:"";position:absolute;top:0;left:0;width:46%;height:100%;background:linear-gradient(105deg,transparent,rgba(47,107,255,.12),transparent);transform:translateX(-130%) skewX(-18deg);transition:none}
.btn:hover:not([disabled]){border-color:#b9cbe6;background:#fff;transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 7px 16px rgba(28,54,102,.1)}
.btn:hover:not([disabled]):before{animation:sheen .7s var(--ease)}
.btn:active:not([disabled]){transform:translateY(0) scale(.97)}
.btn-primary{background:linear-gradient(180deg,#4080ff 0%,#2b64ee 60%,#2355d6 100%);border-color:#2b64ee;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(15,40,110,.25),0 7px 18px rgba(47,107,255,.32)}
.btn-primary:hover:not([disabled]){background:linear-gradient(180deg,#4a86ff,#2f69f2 60%,#2658dc);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 4px rgba(15,40,110,.25),0 10px 24px rgba(47,107,255,.42)}
.btn-violet{background:linear-gradient(180deg,#906bf5,#6d3fe0);border-color:#6d3fe0;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -2px 4px rgba(60,25,140,.3),0 7px 18px rgba(109,63,224,.35)}
.btn-green{background:linear-gradient(180deg,#27bd88,#12996b);border-color:#12996b;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -2px 4px rgba(10,80,55,.3),0 7px 18px rgba(18,153,107,.32)}
.btn-danger{color:var(--red);border-color:#ffd3da;background:#fff5f7}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:saturate(.4)}
.btn-sm{padding:6px 9px;font-size:9px}
.view{padding:20px}
.card{position:relative;background:linear-gradient(180deg,#ffffff,#fbfdff);border:1px solid #e0e8f2;border-radius:var(--r);box-shadow:0 4px 16px rgba(20,40,80,.05),inset 0 1px 0 rgba(255,255,255,.9);transition:.25s var(--ease)}
.card:hover{border-color:#ccd9ec;box-shadow:0 12px 30px rgba(20,40,80,.09),inset 0 1px 0 rgba(255,255,255,.9)}
.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
.muted{color:var(--muted)}.tiny{font-size:9px}.small{font-size:11px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:8px;font-weight:800;background:#f1f5fa;color:#586a85;border:1px solid #e2eaf4}
.tag.blue{background:#eaf2ff;color:#2c5cd0;border-color:#d3e2fc}
.tag.green{background:#e6f8f1;color:#0f7a59;border-color:#c8ecdf}
.tag.amber{background:#fff5dd;color:#99650d;border-color:#f7e3b4}
.notice{border:1px solid #d8e4f6;background:#f4f8fe;color:#41547a;border-radius:10px;padding:10px 12px;font-size:10px;line-height:1.6}
.notice.amber{border-color:#f2d694;background:#fff9ea;color:#7d5715}
.notice.green{border-color:#bde5d6;background:#effaf6;color:#14664e}
.notice.red{border-color:#f9cbd3;background:#fff3f6;color:#96354a}

/* project entry */
.project-select{max-width:1260px;margin:auto;padding:24px 0 48px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px}
.hero h2{font-size:28px;margin:5px 0 8px;background:linear-gradient(92deg,#1b2a47 35%,#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;max-width:760px;font-size:12px;line-height:1.75;color:var(--muted)}
.prototype-badge{border:1px solid #cfdcf4;background:linear-gradient(180deg,#ffffff,#f2f6ff);color:#2c5cd0;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:800;box-shadow:0 5px 16px rgba(47,107,255,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.project-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.project-card{padding:17px;min-height:184px;position:relative;overflow:hidden;animation:panelIn .5s var(--ease) both}
.project-card:nth-child(2){animation-delay:.05s}.project-card:nth-child(3){animation-delay:.1s}.project-card:nth-child(4){animation-delay:.15s}
.project-card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,#2f6bff,transparent);opacity:0;transition:.3s var(--ease)}
.project-card:not(.disabled):hover{transform:translateY(-4px);border-color:#c6d6ee}
.project-card:not(.disabled):hover:before{opacity:1}
.project-card.disabled{opacity:.55;filter:saturate(.35)}
.project-card .tag{position:absolute;right:13px;top:13px}
.project-card h3{font-size:16px;margin:12px 0 6px}
.project-card .budget{font-size:24px;font-weight:900;margin-top:16px;color:#b97a10}
.project-detail{display:grid;grid-template-columns:1.08fr .92fr;gap:14px;margin-top:15px}
.project-main,.project-side{padding:21px}.project-main h3{font-size:20px;margin:6px 0 11px}
.split-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.info-block{background:#f7fafd;border:1px solid #e9eff7;border-radius:11px;padding:12px}
.info-block strong{font-size:11px;display:block;margin-bottom:6px;color:#33445f}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:9px;padding:5px 8px;border:1px solid #dbe4f0;border-radius:999px;background:#fff;color:#52627c;transition:.2s var(--ease)}
.chip:hover{border-color:#aec4e6;color:#2c5cd0;background:#f4f8ff}
.mode-tabs{display:flex;gap:7px;margin:14px 0}
.mode{flex:1;text-align:left;border:1px solid #dde6f1;border-radius:10px;background:#fff;padding:11px;color:var(--text);transition:.22s var(--ease)}
.mode:hover{border-color:#bccfe9;transform:translateY(-1px)}
.mode.active{border-color:#8fb2ff;background:linear-gradient(180deg,#f3f7ff,#e9f0ff);box-shadow:0 0 0 1px #c4d7ff,0 8px 20px rgba(47,107,255,.14),inset 0 1px 0 #fff}
.mode strong{display:block;font-size:11px}.mode span{display:block;font-size:9px;color:var(--muted);margin-top:3px}

/* game */
.workspace{display:grid;grid-template-columns:280px 390px minmax(0,1fr);gap:14px;height:calc(100vh - 108px);min-height:680px}.workspace>*>*{animation:panelIn .42s var(--ease) both}
.context-col,.people-col,.comm-col{min-height:0}.context-col{display:flex;flex-direction:column;gap:11px}
.context-card{padding:15px}.context-card h3,.people-head h3{font-size:14px;margin:0}.context-card p{font-size:10px;line-height:1.65;color:var(--muted)}
.budget-box{background:linear-gradient(135deg,#fdf6e4,#fbf0d2);border:1px solid #f0dcae;border-radius:10px;padding:11px;margin:11px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.budget-box label{font-size:9px;color:#a97e2c}.budget-box strong{display:block;font-size:23px;margin-top:2px;color:#a06a10}
.goal-box{border:1px solid #f0d28d;background:linear-gradient(160deg,#fff8e6,#fffdf4);border-radius:10px;padding:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 14px rgba(180,130,30,.09)}
.goal-box span{font-size:9px;font-weight:900;color:#956612;letter-spacing:.06em}.goal-box strong{display:block;font-size:13px;margin:6px 0}
.info-update{padding:14px}.info-update-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.info-update-head strong{font-size:12px}
.update-list{display:flex;flex-direction:column;gap:7px;max-height:182px;overflow:auto}
.update-item{border-left:2px solid #7fa4f5;padding:5px 7px 5px 10px;border-radius:0 8px 8px 0;background:linear-gradient(90deg,rgba(47,107,255,.08),rgba(47,107,255,0));animation:fadeSlide .32s var(--ease) both}
.update-item b{display:block;font-size:9px;color:#3c62b8}.update-item span{display:block;font-size:8px;color:#75839c;line-height:1.5;margin-top:2px}
.nav-card{padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.nav-card strong{font-size:11px}.nav-card span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.people-col{display:flex;flex-direction:column;background:linear-gradient(180deg,#ffffff,#fafcfe);border:1px solid #e0e8f2;border-radius:var(--r);overflow:hidden;box-shadow:0 10px 30px rgba(20,40,80,.07)}
.people-head{padding:15px 17px 12px;border-bottom:1px solid #e7edf6;background:linear-gradient(180deg,#f6f9ff,#fff)}.people-head p{font-size:9px;color:var(--muted);margin:4px 0 0}
.org-wrap{flex:1;overflow:auto;padding:16px;background:
radial-gradient(circle at 50% 4%,rgba(47,107,255,.05),transparent 34%),
radial-gradient(circle at 82% 60%,rgba(123,75,234,.03),transparent 30%),
linear-gradient(#fcfdff,#fff)}
.org-caption{font-size:8px;color:#93a1b8;text-align:center;margin-bottom:10px}
.org-tree{display:flex;flex-direction:column;align-items:center;min-width:340px;padding-bottom:20px}
.org-level{display:flex;justify-content:center;gap:15px;width:100%;position:relative}
.org-connector-v{width:1px;height:18px;background:#ccd7e7}
.org-branch{width:72%;height:16px;border-top:1px solid #ccd7e7;position:relative}
.org-branch:before,.org-branch:after{content:"";position:absolute;top:-1px;height:16px;border-left:1px solid #ccd7e7}
.org-branch:before{left:12%}.org-branch:after{right:12%}
.person-node{width:164px;border:1px solid #e2e9f3;background:linear-gradient(180deg,#ffffff,#fbfdff);border-radius:13px;padding:10px;text-align:left;color:var(--text);position:relative;box-shadow:0 3px 10px rgba(24,44,84,.06),inset 0 1px 0 #fff;transition:.25s var(--spring)}
.person-node:before{content:"";position:absolute;inset:0;border-radius:13px;background:radial-gradient(120px 44px at 18% 0%,rgba(47,107,255,.09),transparent 70%);opacity:0;transition:.28s var(--ease)}
.person-node:hover{border-color:#bccfef;transform:translateY(-2px);box-shadow:0 9px 20px rgba(24,44,84,.11)}
.person-node:hover:before{opacity:1}
.person-node.active{border-color:#7fa4f5;background:linear-gradient(180deg,#f4f8ff,#ebf2ff);box-shadow:0 0 0 2px rgba(47,107,255,.14),0 10px 24px rgba(47,107,255,.16);transform:translateY(-1px)}
.person-node.active:before{opacity:1}
.person-head{display:grid;grid-template-columns:36px 1fr;gap:9px;align-items:center}
.person-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#f0f4fa,#e2eaf4);color:#5a6c88;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 4px rgba(120,145,185,.25);transition:.28s var(--spring)}
.person-node.active .person-avatar{background:linear-gradient(145deg,#4f8dff,#2b62e8);color:#fff;box-shadow:0 0 12px rgba(47,107,255,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.person-name{font-size:11px;font-weight:900}.person-role{font-size:8px;color:var(--muted);margin-top:2px}
.person-status{font-size:8px;color:#8a99b2;margin-top:5px}
.intel-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.intel-chip{font-size:7.5px;line-height:1.35;color:#2f56a8;background:linear-gradient(180deg,#f0f6ff,#e7efff);border:1px solid #d5e3fd;border-radius:7px;padding:4px 5px;animation:fadeSlide .3s var(--ease) both}
.intel-more{font-size:7px;color:#8491a3}
.org-actions{padding:11px 13px;border-top:1px solid #e7edf6;background:#f9fbfd;display:flex;align-items:center;justify-content:space-between;gap:8px}.org-actions span{font-size:8px;color:var(--muted)}
.comm-col{display:flex;flex-direction:column;background:linear-gradient(180deg,#ffffff,#fafcfe);border:1px solid #e0e8f2;border-radius:var(--r);overflow:hidden;box-shadow:0 14px 34px rgba(20,40,80,.08)}
.contact-detail{height:75px;padding:12px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #e7edf6;background:linear-gradient(90deg,rgba(47,107,255,.07),transparent 55%)}
.contact-detail .person-avatar{width:42px;height:42px;background:linear-gradient(145deg,#4f8dff,#2b62e8);color:#fff;box-shadow:0 0 14px rgba(47,107,255,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.contact-detail h3{font-size:16px;margin:0}.contact-detail p{font-size:9px;color:var(--muted);margin:3px 0 0}.detail-meta{margin-left:auto;display:flex;gap:6px;align-items:center}
.back-global-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #dbe3ef;background:#fff;color:#52627c;border-radius:10px;padding:7px 9px;font-size:8.5px;font-weight:800;transition:.22s var(--ease);white-space:nowrap}
.back-global-btn:hover{border-color:#aec4e6;background:#f4f8ff;color:#2f5bb0;transform:translateX(-2px);box-shadow:0 6px 14px rgba(29,56,104,.09)}
.back-global-btn:active{transform:translateX(0) scale(.98)}
.back-global-btn .arrow{font-size:13px;line-height:1;margin-top:-1px}
.action-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px 14px;border-bottom:1px solid #e7edf6;background:linear-gradient(180deg,#fdfefe,#f8fafd)}
.action-btn{border:1px solid #dde6f1;background:linear-gradient(180deg,#ffffff,#f7fafd);border-radius:10px;padding:8px 5px;text-align:center;color:#5a6c88;font-size:9px;font-weight:800;transition:.22s var(--spring);box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(24,44,84,.05)}
.action-btn:hover{border-color:#b7cbe9;color:#2c5cd0;transform:translateY(-2px);box-shadow:0 7px 15px rgba(28,54,102,.11),inset 0 1px 0 #fff}
.action-btn:active{transform:scale(.96)}
.action-btn.active{border-color:#7fa4f5;background:linear-gradient(180deg,#f0f5ff,#e7efff);color:#2c5cd0;box-shadow:0 0 0 2px rgba(47,107,255,.13),0 7px 18px rgba(47,107,255,.16),inset 0 1px 0 #fff}
.plan-panel{padding:12px 14px;border-bottom:1px solid #e7edf6;background:linear-gradient(180deg,#fbfdff,#f7fafe)}
.plan-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.plan-title strong{font-size:10px}.plan-title span{font-size:8px;color:var(--muted)}
.plan-row{display:flex;gap:8px}
.plan-row textarea{flex:1;min-height:58px;resize:vertical;border:1px solid #dbe4f0;border-radius:10px;padding:9px 10px;font-size:10px;line-height:1.55;outline:none;background:#fbfcfe;color:var(--text);transition:.22s var(--ease)}
.plan-row textarea:hover{border-color:#c2d3ec;background:#fff}
.plan-row textarea:focus{border-color:#7fa4f5;background:#fff;box-shadow:0 0 0 4px rgba(47,107,255,.12)}
.plan-result{margin-top:8px;border:1px solid #bde5d6;background:#effaf6;border-radius:9px;padding:8px 9px;font-size:9px;line-height:1.55;color:#14664e}
.plan-result.warn{border-color:#f0cf87;background:#fff9eb;color:#835b18}
.workspace-body{flex:1;min-height:0;overflow:auto;background:
radial-gradient(circle at 70% 0%,rgba(47,107,255,.05),transparent 28%),
radial-gradient(circle at 20% 90%,rgba(123,75,234,.03),transparent 30%),
linear-gradient(180deg,#f6f9fd,#f2f6fa);padding:14px}.workspace-body>*{animation:panelIn .3s var(--ease) both}
.empty-main{height:100%;min-height:510px;display:grid;place-items:center}
.empty-main-inner{max-width:650px;width:100%;text-align:center}
.empty-main h2{font-size:22px;margin:7px 0;background:linear-gradient(92deg,#1b2a47 40%,#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty-main p{font-size:10px;color:var(--muted);line-height:1.7;margin:0 auto 18px;max-width:520px}
.global-plan{position:relative;overflow:hidden;text-align:left;background:linear-gradient(180deg,#ffffff,#f9fbfe);border:1px solid #dbe5f2;border-radius:17px;padding:20px;box-shadow:0 16px 42px rgba(24,43,77,.1),inset 0 1px 0 #fff}
.global-plan:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#2f6bff,#7b4bea,#0ea5d9,#2f6bff);background-size:200% 100%;animation:shimmer 5s linear infinite}
.global-plan label{font-size:11px;font-weight:900;color:#33445f}
.global-plan textarea{width:100%;min-height:130px;margin-top:9px;border:1px solid #dbe4f0;border-radius:12px;padding:12px;resize:vertical;font-size:11px;line-height:1.6;outline:none;background:#fbfcfe;color:var(--text);transition:.22s var(--ease)}
.global-plan textarea:hover{background:#fff;border-color:#c2d3ec}
.global-plan textarea:focus{background:#fff;border-color:#7fa4f5;box-shadow:0 0 0 4px rgba(47,107,255,.12)}
.global-plan-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.global-plan-foot span{font-size:8px;color:var(--muted)}
.workspace-card{max-width:780px;margin:0 auto;background:linear-gradient(180deg,#ffffff,#fafcfe);border:1px solid #e0e8f2;border-radius:16px;overflow:hidden;box-shadow:0 12px 32px rgba(20,40,80,.08),inset 0 1px 0 #fff;animation:panelIn .32s var(--ease) both}
.workspace-card-head{padding:14px 16px;border-bottom:1px solid #e7edf6;background:linear-gradient(180deg,#fbfdff,#fff)}
.workspace-card-head h2{font-size:15px;margin:0}.workspace-card-head p{font-size:9px;color:var(--muted);margin:4px 0 0;line-height:1.55}
.thread{min-height:165px;max-height:265px;overflow:auto;padding:14px}
.message{max-width:82%;border-radius:13px;padding:9px 11px;margin-bottom:8px;font-size:10px;line-height:1.55;animation:panelIn .25s var(--spring) both}
.message.player{margin-left:auto;background:linear-gradient(180deg,#3d76f0,#2757cd);color:#eef4ff;border-bottom-right-radius:4px;box-shadow:0 5px 14px rgba(39,87,205,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.message.npc{background:linear-gradient(180deg,#f6f8fb,#eff3f8);color:#3d4c64;border:1px solid #e4eaf3;border-bottom-left-radius:4px;box-shadow:0 3px 8px rgba(24,44,84,.06)}
.message .meta{font-size:7px;color:#8c99ad;margin-bottom:3px}
.message.pending{opacity:.82}
.message.failed{border:1px solid #f3b8c2;background:#fff4f6;color:#8c3042;box-shadow:none}
.typing-dots{display:inline-flex;align-items:center;gap:3px;height:12px;margin-left:3px;vertical-align:middle}
.typing-dots i{width:4px;height:4px;border-radius:50%;background:#8190a7;animation:pulseDot 1.15s ease-in-out infinite}
.typing-dots i:nth-child(2){animation-delay:.16s}.typing-dots i:nth-child(3){animation-delay:.32s}
.message .read-status{display:inline-flex;align-items:center;margin-left:6px;color:#d9e6ff;font-weight:800;letter-spacing:.02em}
.message.npc .read-status{color:#6c7d96}
.message-attachment{margin-top:6px;padding:5px 7px;border-radius:6px;background:rgba(255,255,255,.75);border:1px solid rgba(47,107,255,.18);font-size:8px;color:#33589c}
.expression-tools{display:flex;gap:7px;align-items:center;margin-top:8px}
.expression-tool{border:1px solid #d7e1ee;background:#fff;color:#536580;border-radius:8px;padding:6px 9px;font-size:9px;font-weight:800;transition:.2s var(--ease)}
.expression-tool:hover,.expression-tool[aria-expanded="true"]{border-color:#9eb9ee;background:#f1f6ff;color:#2c5cd0;box-shadow:0 4px 10px rgba(47,107,255,.11)}
.expression-panels{margin-top:8px}
.expression-panel{border:1px solid #dbe5f2;border-radius:11px;background:linear-gradient(180deg,#fff,#f8fbff);padding:10px;box-shadow:0 8px 18px rgba(24,43,77,.08);animation:panelIn .2s var(--ease) both}
.expression-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#465a78;font-size:9px;font-weight:900}
.expression-panel-head span{font-size:8px;color:#8795aa;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(28px,1fr));gap:5px}
.emoji-btn{border:1px solid #e0e8f2;border-radius:8px;background:#fff;min-height:34px;font-size:20px;line-height:1;transition:.18s var(--spring)}
.emoji-btn:hover{border-color:#9eb9ee;background:#f1f6ff;transform:translateY(-2px);box-shadow:0 5px 10px rgba(47,107,255,.12)}
.sticker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.sticker-option{border:1px solid #dbe5f2;border-radius:10px;background:linear-gradient(180deg,#fff,#f6f9fe);padding:8px 5px;min-height:84px;text-align:center;color:#33445f;transition:.2s var(--spring)}
.sticker-option:hover:not([disabled]){border-color:#8eace5;background:#f0f5ff;transform:translateY(-2px);box-shadow:0 7px 14px rgba(47,107,255,.13)}
.sticker-option[disabled]{opacity:.5;cursor:not-allowed}
.sticker-option .sticker-symbol{display:block;font-size:30px;line-height:1.1;margin-bottom:4px}
.sticker-option strong{display:block;font-size:9px}.sticker-option small{display:block;color:#7b8aa0;font-size:7px;line-height:1.35;margin-top:3px}
.sticker-message{padding:7px 8px!important}.sticker-bubble{display:flex;align-items:center;gap:8px;min-width:122px}.sticker-bubble .sticker-bubble-symbol{font-size:32px;line-height:1}.sticker-bubble strong{font-size:10px;color:#fff;white-space:nowrap}
.message.npc .sticker-bubble strong{color:#33445f}
.composer{border-top:1px solid #e7edf6;padding:12px 14px;background:#fcfdff}
.composer textarea,.form-area{width:100%;resize:vertical;border:1px solid #dbe4f0;border-radius:10px;padding:10px 11px;font-size:10px;line-height:1.55;outline:none;background:#fbfcfe;color:var(--text);transition:.22s var(--ease)}
.composer textarea:hover,.form-area:hover{background:#fff;border-color:#c2d3ec}
.composer textarea:focus,.form-area:focus{background:#fff;border-color:#7fa4f5;box-shadow:0 0 0 4px rgba(47,107,255,.12)}
.attach-area{margin-top:9px;border:1px dashed #ccd9ec;background:#f8fbfd;border-radius:9px;padding:9px}
.attach-area strong{font-size:9px;color:#33445f}.attach-area p{font-size:8px;color:var(--muted);margin:3px 0 7px;line-height:1.45}.attach-area textarea{min-height:54px;background:#fff}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.cost-note{font-size:8px;color:#6c788a}.cost-note strong{color:#99650d}
.phone-panel{height:100%;min-height:420px;border-radius:16px;background:
radial-gradient(circle at 50% 46%,rgba(124,83,234,.3),transparent 30%),
radial-gradient(circle at 50% 52%,rgba(43,98,232,.16),transparent 48%),
linear-gradient(150deg,#101b31,#16263f 55%,#0c1526);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 1px 0 rgba(170,198,245,.1),inset 0 -40px 80px rgba(5,12,26,.5),var(--shadow-lg)}
.phone-inner{max-width:480px}
.phone-inner h2{font-size:18px;margin:0;text-shadow:0 2px 16px rgba(77,141,255,.35)}
.phone-inner p{font-size:10px;color:#a9b9d4}
.call-avatar{width:82px;height:82px;border-radius:50%;background:linear-gradient(145deg,#b18cff,#6f3fe4);display:grid;place-items:center;margin:18px auto 10px;font-size:32px;font-weight:900;box-shadow:0 0 0 12px rgba(139,92,246,.09),0 0 0 26px rgba(139,92,246,.04),0 16px 34px rgba(80,42,160,.45),inset 0 2px 0 rgba(255,255,255,.3);animation:pulseDot 3.2s ease-in-out infinite}
.phone-log{margin:12px 0;background:rgba(255,255,255,.07);border:1px solid rgba(170,198,245,.12);border-radius:10px;padding:9px;text-align:left;font-size:9px;line-height:1.55;color:#d5e0f0}
.phone-line+.phone-line{margin-top:5px}.phone-line.pending{color:#aebdd3}.phone-line.failed{color:#ffb8c3}
.wechat-request{padding:22px}
.wechat-request h3{font-size:15px;margin:0 0 5px}.wechat-request p{font-size:9px;color:var(--muted);line-height:1.6}.wechat-request textarea{min-height:100px}
.postal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}
.postal-box{border:1px solid #e2eaf4;border-radius:10px;padding:11px;background:#f8fbfd;box-shadow:inset 0 1px 0 #fff}
.postal-box strong{font-size:10px;color:#33445f}.postal-box span{display:block;font-size:8px;color:var(--muted);margin-top:4px;line-height:1.5}
.visit-choice{padding:15px}
.visit-choice h3{font-size:15px;margin:0 0 5px}.visit-choice>p{font-size:9px;color:var(--muted);line-height:1.6;margin:0 0 12px}
.visit-modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.visit-mode{border:1px solid #dde6f1;border-radius:12px;background:#fff;padding:12px;text-align:left;color:var(--text);transition:.25s var(--spring);box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(24,44,84,.05)}
.visit-mode:hover:not(.disabled){border-color:#b7cbe9;transform:translateY(-3px);box-shadow:0 10px 24px rgba(28,54,102,.12),0 0 0 1px rgba(47,107,255,.18),inset 0 1px 0 #fff}
.visit-mode.disabled{opacity:.5;filter:saturate(.4)}
.visit-mode strong{display:block;font-size:11px}.visit-mode span{display:block;font-size:8px;color:var(--muted);line-height:1.5;margin-top:4px}
.visit-prep{padding:14px}
.visit-prep h3{font-size:15px;margin:0}.visit-prep p{font-size:9px;color:var(--muted);line-height:1.6}.visit-prep textarea{min-height:140px}
.meeting-scene{height:100%;min-height:470px;border-radius:16px;position:relative;overflow:hidden;background:
radial-gradient(circle at 78% 12%,rgba(120,170,255,.13),transparent 26%),
radial-gradient(circle at 15% 85%,rgba(124,83,234,.12),transparent 32%),
linear-gradient(180deg,rgba(8,16,30,.2),rgba(3,9,18,.92)),
linear-gradient(135deg,#33465c,#1b2836 55%,#0d141d);color:#fff;padding:17px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(190,214,250,.08)}
.meeting-scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(160,195,245,.025) 46px 48px);pointer-events:none}
.meeting-top{display:flex;justify-content:space-between}.meeting-top h2{font-size:16px;margin:5px 0;text-shadow:0 2px 14px rgba(90,140,230,.4)}
.meeting-pill{background:rgba(6,14,26,.6);border:1px solid rgba(150,185,240,.25);border-radius:999px;padding:6px 10px;font-size:8px;height:max-content;box-shadow:inset 0 1px 0 rgba(190,214,250,.1)}
.meeting-pill:before{content:"●";color:#3ecf8e;margin-right:5px;animation:pulseDot 1.8s ease-in-out infinite}
.meeting-chat{margin-top:auto;max-width:780px;width:100%;align-self:center}
.npc-stage{display:flex;gap:11px;align-items:flex-end;background:rgba(4,11,21,.72);border:1px solid rgba(150,185,240,.2);border-radius:14px;padding:10px;backdrop-filter:blur(6px);animation:panelIn .35s var(--ease) both}
.portrait{width:76px;height:102px;border-radius:10px;background:linear-gradient(165deg,#46617e,#1c2c40 70%);border:1px solid rgba(150,185,240,.22);display:grid;place-items:center;font-size:26px;font-weight:900;box-shadow:inset 0 1px 0 rgba(190,214,250,.15),0 8px 20px rgba(2,6,16,.45);position:relative}
.portrait:after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:44%;height:3px;border-radius:99px;background:#f6bd4f;opacity:.85}
.speech{background:linear-gradient(180deg,#fdfeff,#eef3fa);color:#27364d;border-radius:13px 13px 13px 4px;padding:11px;flex:1;font-size:10px;line-height:1.6;box-shadow:0 10px 26px rgba(2,6,16,.5)}
.speech strong{display:block;color:#a06a12;font-size:9px;margin-bottom:3px}
.player-last{max-width:610px;margin:7px 0 7px auto;background:rgba(43,98,232,.22);border:1px solid rgba(120,164,230,.3);border-radius:9px;padding:7px 9px;font-size:8px;color:#d5e3f8;backdrop-filter:blur(4px)}
.player-last strong{color:#8fb7ff}
.meeting-composer{display:flex;gap:7px}
.meeting-composer textarea{flex:1;border-radius:9px;border:1px solid rgba(160,190,240,.3);padding:9px;resize:none;min-height:52px;background:rgba(6,13,25,.65);color:#fff;outline:none;transition:.22s var(--ease)}
.meeting-composer textarea:focus{border-color:rgba(130,175,255,.75);box-shadow:0 0 0 4px rgba(77,141,255,.18)}
.brief-result{padding:18px}
.brief-result h3{font-size:15px;margin:0 0 5px}.brief-result p{font-size:9px;color:var(--muted);line-height:1.65}
.analysis-box{margin-top:12px;background:#f7fafd;border:1px solid #e5edf6;border-radius:10px;padding:11px;animation:panelIn .35s var(--ease) both}
.analysis-box strong{font-size:10px;color:#33445f}.analysis-box ul{padding-left:16px;margin:7px 0 0}
.analysis-box li{font-size:9px;color:#5e6d84;margin:5px 0;line-height:1.5}

/* result + modal */
.result-page{max-width:1220px;margin:auto;padding:3px 0 45px}
.result-hero{position:relative;overflow:hidden;background:radial-gradient(700px 320px at 88% -20%,rgba(246,189,79,.16),transparent 55%),linear-gradient(135deg,#101b31,#16263f 52%,#0c1526);border:1px solid rgba(90,130,200,.35);color:#fff;border-radius:17px;padding:23px;display:flex;justify-content:space-between;gap:20px;box-shadow:var(--shadow-lg)}
.result-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(190,214,250,.09) 50%,transparent 58%);animation:sheen 4.2s var(--ease) infinite}
.result-hero h2{font-size:29px;margin:4px 0;background:linear-gradient(92deg,#fff 45%,#ffd582);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.score-box strong{display:inline-block;font-size:43px;background:linear-gradient(180deg,#ffe9b8,#f6bd4f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(246,189,79,.4))}
.result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}
.result-stat{position:relative;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(190,214,250,.16);border-radius:10px;padding:10px;animation:panelIn .5s var(--ease) both}
.result-stat:nth-child(2){animation-delay:.06s}.result-stat:nth-child(3){animation-delay:.12s}.result-stat:nth-child(4){animation-delay:.18s}
.result-stat span{display:block;font-size:8px;color:#b9c9e4}.result-stat strong{display:block;font-size:16px;margin-top:4px;color:#ffd582}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.result-card{padding:18px}.result-card h3{font-size:13px;margin:0 0 12px}
.score-row{display:grid;grid-template-columns:92px 1fr 32px;gap:8px;align-items:center;margin:9px 0;font-size:9px;color:#43536d}
.bar{height:7px;background:#eaeff6;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(24,44,84,.08)}
.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2b62e8,#4d8dff 70%,#38c8f0);transform-origin:left center;animation:barGrow .9s var(--ease) both;box-shadow:0 0 8px rgba(47,107,255,.35)}
.attitude-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.attitude{border:1px solid #e5edf6;border-radius:10px;padding:10px;background:#fafcfe}
.attitude-head{display:flex;gap:8px;align-items:center}.attitude .person-avatar{width:30px;height:30px}
.evidence-item{border-left:2px solid #27bd88;padding:5px 0 5px 9px;font-size:9px;margin-bottom:8px;color:#43536d}
.evidence-item small{display:block;color:var(--muted);margin-top:3px}
.diagnosis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.result-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(23,38,66,.4);backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:18px;animation:backdropIn .2s ease both}
.modal{width:min(620px,96vw);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#ffffff,#f9fbfe);border:1px solid rgba(255,255,255,.7);border-radius:17px;box-shadow:0 30px 90px rgba(15,30,60,.32),0 0 70px rgba(47,107,255,.14);animation:modalIn .3s var(--spring) both}
.modal-head{padding:14px 16px;border-bottom:1px solid #e7edf6;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#f7faff,#fff)}
.modal-head h3{font-size:14px;margin:0}
.modal-close{border:0;background:transparent;font-size:20px;color:#8a99b2;transition:.25s var(--ease)}
.modal-close:hover{color:var(--red);transform:rotate(90deg) scale(1.08)}
.modal-body{padding:15px}.modal-footer{padding:12px 15px;border-top:1px solid #e7edf6;display:flex;justify-content:flex-end;gap:8px}
.check-list{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.check-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2eaf4;border-radius:9px;padding:9px 10px;font-size:9px;background:#fafcfe;animation:panelIn .35s var(--ease) both}
.check-item:nth-child(2){animation-delay:.05s}.check-item:nth-child(3){animation-delay:.1s}.check-item:nth-child(4){animation-delay:.15s}.check-item:nth-child(5){animation-delay:.2s}
.test-controls-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.test-control{border:1px solid #e2eaf4;border-radius:10px;background:#f8fbfd;padding:9px}
.test-control label{display:block;font-size:8px;font-weight:900;color:#536580;margin-bottom:5px}
.test-control input,.test-wechat-row select,.test-npc-metric input{width:100%;border:1px solid #d5e0ee;border-radius:8px;background:#fff;color:var(--text);padding:7px 8px;font-size:10px;outline:none}
.test-control input:focus,.test-wechat-row select:focus,.test-npc-metric input:focus{border-color:#7fa4f5;box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.test-wechat-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.test-wechat-row{display:flex;align-items:center;gap:8px;border:1px solid #e2eaf4;border-radius:9px;background:#fff;padding:8px 9px}
.test-wechat-row label{min-width:72px;font-size:9px;font-weight:800;color:#40516b}.test-wechat-row select{flex:1}
.test-npc-state-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.test-npc-state-row{border:1px solid #e2eaf4;border-radius:10px;background:#fff;padding:9px}
.test-npc-state-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:9px}.test-npc-state-head strong{color:#40516b}.test-npc-state-actions{display:flex;align-items:center;gap:8px}.test-npc-enable{display:flex;align-items:center;gap:4px;color:#60718b;font-weight:800;cursor:pointer}.test-npc-enable input{accent-color:#2f6bff}.test-node{border-radius:999px;background:#eef4ff;color:#315fb7;padding:3px 7px;font-weight:900}
.test-npc-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.test-npc-metric label{display:block;font-size:8px;font-weight:800;color:#6b7a91;margin-bottom:4px}
.test-npc-metric input:disabled{background:#f1f4f8;color:#8b98aa;cursor:not-allowed}
.test-appointment-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.test-appointment-row{border:1px solid #e2eaf4;border-radius:10px;background:#fff;padding:9px}.test-appointment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.test-appointment-grid select{width:100%;border:1px solid #d5e0ee;border-radius:8px;background:#fff;color:var(--text);padding:7px 8px;font-size:10px;outline:none}.test-appointment-grid input:disabled,.test-appointment-grid select:disabled{background:#f1f4f8;color:#8b98aa;cursor:not-allowed}.test-appointment-grid select:focus,.test-appointment-grid input:focus{border-color:#7fa4f5;box-shadow:0 0 0 3px rgba(47,107,255,.1)}.test-appointment-agenda{grid-column:1/3}
.ok{color:#12996b;font-weight:800;text-shadow:0 0 10px rgba(18,153,107,.3)}.warn{color:#b97a10;font-weight:800;text-shadow:0 0 10px rgba(223,148,22,.28)}
.toast-root{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:7px}
.toast{position:relative;background:rgba(20,31,54,.94);backdrop-filter:blur(12px);border:1px solid rgba(110,146,208,.32);color:#e5edfa;padding:11px 13px 11px 17px;border-radius:10px;box-shadow:0 16px 38px rgba(1,4,12,.55);font-size:9px;max-width:340px;animation:toastIn .3s var(--spring) both;overflow:hidden}

async function readPreviewStream(response,onDelta){

  const raw=block.split(/\r?\n/).filter(line=>line.startsWith('data:')).map(line=>line.slice(5).trim()).join('');
  if(!raw)return;
  const event=JSON.parse(raw);
  if(event.type==='delta'&&typeof event.content==='string'){onDelta?.(event.content);return}
  if(event.type==='result'&&event.data){result=event.data;return}
  if(event.type==='error')throw {status:Number(event.status)||503,message:event.error||'流式响应失败'};
 };
 while(true){
  const {done,value}=await reader.read();
  if(done)break;
  buffer+=decoder.decode(value,{stream:true});
  const blocks=buffer.split(/\r?\n\r?\n/);buffer=blocks.pop()||'';
  for(const block of blocks)consume(block);
 }

}

 function rememberMessageCaret(textarea=document.getElementById('message-text')){
  if(!textarea)return;
  const valueLength=textarea.value.length,start=Number.isInteger(textarea.selectionStart)?textarea.selectionStart:valueLength,end=Number.isInteger(textarea.selectionEnd)?textarea.selectionEnd:start;
  expressionCaret={start:Math.max(0,Math.min(start,valueLength)),end:Math.max(0,Math.min(end,valueLength))};
 }
 function closeExpressionPanels(){
  const panels=[...document.querySelectorAll('[data-expression-panel]:not(.hidden)')];
  if(!panels.length)return false;
  panels.forEach(panel=>panel.classList.add('hidden'));
  document.querySelectorAll('[data-expression-toggle]').forEach(button=>button.setAttribute('aria-expanded','false'));
  return true;
 }
 function toggleExpressionPanel(name){
  const target=document.querySelector(`[data-expression-panel="${name}"]`);
  if(!target)return;
  const shouldOpen=target.classList.contains('hidden');
  closeExpressionPanels();
  if(shouldOpen){
   target.classList.remove('hidden');
   document.querySelector(`[data-expression-toggle="${name}"]`)?.setAttribute('aria-expanded','true');
  }

 function insertEmoji(emoji){
  if(!COMMON_WECHAT_EMOJIS.includes(emoji))return;
  const textarea=document.getElementById('message-text');
  if(!textarea)return;
  const active=document.activeElement===textarea,value=textarea.value,start=active?textarea.selectionStart:expressionCaret.start,end=active?textarea.selectionEnd:expressionCaret.end;
  const safeStart=Math.max(0,Math.min(Number.isInteger(start)?start:value.length,value.length)),safeEnd=Math.max(safeStart,Math.min(Number.isInteger(end)?end:safeStart,value.length));
  textarea.value=`${value.slice(0,safeStart)}${emoji}${value.slice(safeEnd)}`;
  const cursor=safeStart+emoji.length;
  textarea.focus();textarea.setSelectionRange(cursor,cursor);rememberMessageCaret(textarea);
  textarea.dispatchEvent(new Event('input',{bubbles:true}));
 }

async function loadImageAssets(){
 try{
  const response=await fetch('/api/designer/image-assets',{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  if(!Array.isArray(data.assets))return;
  for(const asset of data.assets){
   if(typeof asset.slotKey==='string'&&typeof asset.imageUrl==='string'&&asset.imageUrl)uploadedImageUrls[asset.slotKey]=asset.imageUrl;

  render();
 }catch{/* Existing introduction images remain available if the asset service is temporarily unavailable. */}
}

 document.querySelectorAll('[data-expression-emoji]').forEach(button=>button.addEventListener('click',()=>insertEmoji(button.dataset.expressionEmoji)));
 document.querySelectorAll('[data-sticker-id]').forEach(button=>button.addEventListener('click',()=>sendSticker(button.dataset.stickerId)));
 const entry=document.querySelector('[data-visit-entry-until]'),entryUntil=Number(entry?.dataset.visitEntryUntil);
 if(entry&&entryUntil>Date.now())setTimeout(()=>{if(state.meeting&&Number(state.meeting.entryTransitionUntil)===entryUntil){delete state.meeting.entryTransitionUntil;save();render()}},entryUntil-Date.now()+20);
 if(state.screen==='result'){
  const el=document.querySelector('.score-box strong');
  if(el){const target=parseInt(el.textContent,10)||0,t0=performance.now();
   const tick=t=>{const k=Math.min(1,(t-t0)/900),ease=1-Math.pow(1-k,3);
    el.textContent=Math.round(target*ease);if(k<1)requestAnimationFrame(tick)};
   el.textContent='0';requestAnimationFrame(tick)}
 }
 const gp=document.getElementById('global-plan');
 if(gp)gp.addEventListener('input',()=>{state.workPlans.global=gp.value;save()});
 const np=document.getElementById('npc-plan');
 if(np)np.addEventListener('input',()=>{if(state.selectedNpcId){state.workPlans.byNpc[state.selectedNpcId]=np.value;save()}});
 const at=document.getElementById('attachment-text');
 if(at)at.addEventListener('input',updateMessageCost);

 if(messageText){

 }
 updateMessageCost();
}

 const cost=att.value.trim()?2:1;

 btn.textContent=`发送${label} · ${cost}点`;

   state.phoneActive=false;

async function analyzePlan(scope){
 const id=scope==='global'?null:state.selectedNpcId;
 const el=document.getElementById(scope==='global'?'global-plan':'npc-plan'),text=el?.value.trim()||'';
 if(!text){toast('工作计划可以不填；如果要提交，请先输入一些内容。','warn');return}
 if(scope==='global')state.workPlans.global=text;else state.workPlans.byNpc[id]=text;

 const rawRes=await apiCall('plan',{npcId:id||undefined,text,phase:state.phase});
 const res=rawRes?{...rawRes,revealDetails:rawRes.disclosed||[],matched:(rawRes.matchedNpcIds||[]).map(npcId=>({npcId,name:npc(npcId)?.name||npcId,matchedKeywords:[]}))}:null;
 if(!res){render();return}

 // 内容过于简单：只提示细化，不扣点，也不给引导问题。
 if(res.needsDetail){
   if(scope==='global')state.planAnalysis.global=res;else state.planAnalysis.byNpc[id]=res;
   save();render();toast('计划描述过于简单，请进一步细化。','warn');return;
 }

 // 同一份完全相同的有效计划重复查看，不重复扣点。
 const previous=scope==='global'?state.submittedPlans.global:state.submittedPlans.byNpc[id];
 const isRepeat=previous===text;
 if(!isRepeat && !spend(1,'提交工作计划'))return;

 const disclosed=[];
 (res.revealDetails||[]).forEach(d=>{
   const target=npc(d.npcId);

 if(!res){player.pending=false;player.failed=true;reply.pending=false;reply.failed=true;reply.text=reply.text||'本轮回应失败，请重试。';save();refreshWorkspaceBody();refreshAiFeedback();return}
 player.pending=false;player.failed=false;reply.pending=false;reply.failed=false;reply.text=res.content||reply.text;reply.taskType=res.taskType||null;state.aiRetry=null;
  const remote=res.meeting;
 if(!remote){state.aiError='服务端未返回会面状态，请重试。';reply.failed=true;save();refreshWorkspaceBody();return}
  m.turn=Number(remote.turn??m.turn??0);m.completedTasks=Array.isArray(remote.completedTasks)?remote.completedTasks:(m.completedTasks||[]);m.awaitingFinalReplyFrom=remote.awaitingFinalReplyFrom||null;
  if(['angry','serious','calm','pleasant','very_happy'].includes(res.npcExpression))state.npcExpressions[n.id]=res.npcExpression;
 if(!res.content){const index=arr.indexOf(reply);if(index>=0)arr.splice(index,1)}
  if(remote.meetingEnded){save();refreshWorkspaceBody();await new Promise(resolve=>setTimeout(resolve,650));return finishVisitFromServer({...res,...remote})}
 save();refreshWorkspaceBody();
}
function endReasonLabel(endReason){
 const labels={npc_task_completed:'NPC已完成本次任务（提问 / 质疑 / 挖坑）',turn_limit:'对话轮次已超过20轮',player_farewell:'玩家告辞，NPC完成最后回应',npc_farewell:'NPC告辞，玩家完成最后回应',npc_time_constraint:'NPC表示忙碌或另有会议，会面立即结束'};
 return labels[endReason]||'本次拜访已由服务端结束';
}
function finishVisitFromServer(result){
 const m=state.meeting;if(!m)return;
 const endReason=result.endReason||'player_farewell',turn=Number(result.turn??m.turn??0),completedTasks=Array.isArray(result.completedTasks)?result.completedTasks:(m.completedTasks||[]);
 const n=npc(m.npcId),appt=state.appointments.find(a=>a.id===m.appointmentId);if(result.appointment)upsertAppointment(result.appointment,n.id);else if(appt)appt.status='completed';
 state.completedVisits.push({npcId:n.id,type:'simulated',phase:state.phase,endReason,turns:turn,completedTasks:[...completedTasks]});
 state.meeting=null;state.workspaceMode='overview';addUpdate(`已完成与 ${n.name} 的实际拜访模拟：${endReasonLabel(endReason)}。`);save();render();
 openModal('拜访结束',`<div class="notice green">${esc(endReasonLabel(endReason))}</div><div class="small muted" style="margin-top:10px">本次共进行 ${turn} 轮对话。</div>`,`<button class="btn btn-primary" data-modal-close>确认</button>`);toast('拜访已结束','success')
}
async function endVisit(){
 const m=state.meeting;if(!m)return;
 const n=npc(m.npcId);
 return meetingSend({payload:{npcId:n.id,text:'谢谢您的时间，今天先到这里，再见。',phase:state.phase}})
}
function showEndPhase(){
 if(state.phase===5)return showSubmission();
 const open=state.appointments.filter(a=>a.status==='accepted');
 openModal(`结束第 ${state.phase} 阶段`,`<div class="notice amber">结束阶段前请检查未完成事项。</div><div class="check-list"><div class="check-item"><span>当前无进行中的拜访</span><span class="${!state.meeting?'ok':'warn'}">${!state.meeting?'✓ 已处理':'! 请注意'}</span></div><div class="check-item"><span>已邀约但未完成的拜访</span><span class="${open.length?'warn':'ok'}">${open.length?`! ${open.length} 项`:'✓ 已处理'}</span></div><div class="check-item"><span>当前行动点</span><strong>${state.actionPoints}</strong></div></div>`,`<button class="btn" data-modal-close>取消</button><button class="btn btn-primary" id="next-phase">确认进入下一阶段</button>`);
 document.getElementById('next-phase').onclick=advancePhase
}
function advancePhase(){
 state.phase+=1;state.actionPoints=Math.min(28,state.actionPoints+8);state.selectedNpcId=null;state.workspaceMode='overview';state.phoneActive=false;if(state.phase>=3&&state.competitorEventsSeen.length<MockData.competitorEvents.length)state.competitorEventsSeen.push(MockData.competitorEvents[state.competitorEventsSeen.length]);addUpdate(`已进入第 ${state.phase} 阶段 · ${phaseMeta().name}。`);save();closeModal();render();toast('已进入下一阶段','success')
}
function showSubmission(){
 const contacted=MockData.npcs.filter(n=>Object.values(state.conversations[n.id]).some(a=>a.length)).length,visits=state.completedVisits.length,plans=(state.workPlans.global?1:0)+Object.values(state.workPlans.byNpc).filter(Boolean).length;
 openModal('项目提交检查',`${state.phase<5?'<div class="notice red">当前未到第 5 阶段；原型仍允许查看提交体验。</div>':'<div class="notice green">已进入最终阶段。</div>'}<div class="check-list"><div class="check-item"><span>已形成沟通记录的联系人</span><strong>${contacted} / ${MockData.npcs.length}</strong></div><div class="check-item"><span>已完成拜访 / 拜访方案</span><strong>${visits} 次</strong></div><div class="check-item"><span>已输入并分析的工作计划</span><strong>${plans} 份</strong></div><div class="check-item"><span>已获得公开信息的人物</span><strong>${Object.entries(state.publicIntel).filter(([id,items])=>npcIds.has(id)&&items.length).length} 人</strong></div><div class="check-item"><span>累计消耗行动点</span><strong>${state.totalSpent}</strong></div></div>`,`<button class="btn" data-modal-close>继续行动</button><button class="btn btn-primary" id="confirm-submit">确认提交项目</button>`);
 document.getElementById('confirm-submit').onclick=submitProject
}
async function submitProject(){const r=await DemoOnlyApi.submitProject();state.result=r;state.screen='result';save();closeModal();render();toast('前端结果样例已生成','success')}
async function resetPreview(){
 const res=await apiCall('reset',{});
 if(!res){render();return}

function refreshPreview(){clearAiRuntimeState();window.location.reload()}
function clampTestInteger(value,min,max,fallback){
 const parsed=Number.parseInt(value,10);
 return Number.isFinite(parsed)?Math.max(min,Math.min(max,parsed)):fallback;
}
function openTestControls(){
 const statusOptions=current=>[['','未添加'],['accepted','已添加'],['pending','待处理'],['rejected','已拒绝']].map(([value,label])=>`<option value="${value}" ${current===value?'selected':''}>${label}</option>`).join('');
 const appointmentStatusOptions=current=>TEST_APPOINTMENT_STATUSES.map(value=>{const labels={none:'无预约',pending:'待处理',accepted:'已接受',rejected:'已拒绝',later:'待改期',completed:'已完成',cancelled:'已取消'};return `<option value="${value}" ${current===value?'selected':''}>${labels[value]}</option>`}).join('');
 const npcRows=MockData.npcs.map(person=>{const values=state.npcTestStates[person.id]||blankNpcTestStates()[person.id];return `<div class="test-npc-state-row"><div class="test-npc-state-head"><strong>${esc(person.name)} · ${esc(person.title)}</strong><div class="test-npc-state-actions"><label class="test-npc-enable"><input type="checkbox" data-test-npc-enable="${person.id}">覆盖本 NPC</label><span class="test-node">节点 ${esc(values.node||'待应用')}</span></div></div><div class="test-npc-metrics"><div class="test-npc-metric"><label for="test-support-${person.id}">支持度（0–100）</label><input id="test-support-${person.id}" data-test-npc="${person.id}" data-test-field="support" type="number" min="0" max="100" value="${values.support}" disabled></div><div class="test-npc-metric"><label for="test-pleasantness-${person.id}">愉悦度（0–100）</label><input id="test-pleasantness-${person.id}" data-test-npc="${person.id}" data-test-field="pleasantness" type="number" min="0" max="100" value="${values.pleasantness}" disabled></div><div class="test-npc-metric"><label for="test-contact-${person.id}">有效接触次数（0–100）</label><input id="test-contact-${person.id}" data-test-npc="${person.id}" data-test-field="effectiveContactCount" type="number" min="0" max="100" value="${values.effectiveContactCount}" disabled></div></div></div>`}).join('');
 const appointmentRows=MockData.npcs.map(person=>{const current=state.appointments.find(item=>item.npcId===person.id),values=current||{id:'',status:'none',phase:state.phase,timeWindow:'待设置时间',location:'待设置地点',agenda:'待设置议题'};return `<div class="test-appointment-row" data-test-appointment="${person.id}"><div class="test-npc-state-head"><strong>${esc(person.name)} · 拜访预约</strong><label class="test-npc-enable"><input type="checkbox" data-test-appointment-enable="${person.id}">覆盖预约</label></div><div class="test-appointment-grid"><div class="test-control"><label for="test-appointment-status-${person.id}">预约状态</label><select id="test-appointment-status-${person.id}" data-test-appointment-field="status" disabled>${appointmentStatusOptions(values.status)}</select></div><div class="test-control"><label for="test-appointment-phase-${person.id}">预约阶段（1–5）</label><input id="test-appointment-phase-${person.id}" data-test-appointment-field="phase" type="number" min="1" max="5" value="${values.phase}" disabled></div><div class="test-control"><label for="test-appointment-time-${person.id}">时间说明</label><input id="test-appointment-time-${person.id}" data-test-appointment-field="timeWindow" type="text" maxlength="120" value="${esc(values.timeWindow)}" disabled></div><div class="test-control"><label for="test-appointment-location-${person.id}">拜访地点</label><input id="test-appointment-location-${person.id}" data-test-appointment-field="location" type="text" maxlength="120" value="${esc(values.location)}" disabled></div><div class="test-control test-appointment-agenda"><label for="test-appointment-agenda-${person.id}">拜访议题</label><input id="test-appointment-agenda-${person.id}" data-test-appointment-field="agenda" type="text" maxlength="300" value="${esc(values.agenda)}" disabled></div></div></div>`}).join('');
 openModal('测试调节',`<div class="notice amber">测试值只作用于当前五人版预览会话，不写入正式存档。NPC 数值与拜访预约会同步到服务端，后续拜访读取服务端结果。</div><div class="test-controls-grid" style="margin-top:10px"><div class="test-control"><label for="test-phase">当前阶段（1–5）</label><input id="test-phase" type="number" min="1" max="5" value="${state.phase}"></div><div class="test-control"><label for="test-action-points">行动点（0–999）</label><input id="test-action-points" type="number" min="0" max="999" value="${state.actionPoints}"></div><div class="test-control"><label for="test-total-spent">累计消耗（0–9999）</label><input id="test-total-spent" type="number" min="0" max="9999" value="${state.totalSpent}"></div></div><div class="info-block" style="margin-top:10px"><strong>NPC 状态数值</strong><div class="tiny muted">关系节点由支持度、有效接触和已获得证据共同计算；仅提高数值不一定直接升级节点。</div><div class="test-npc-state-list">${npcRows}</div></div><div class="info-block" style="margin-top:10px"><strong>拜访预约</strong><div class="tiny muted">勾选“覆盖预约”后可修改状态、阶段、时间、地点和议题；没有预约的人物也可用“已接受”创建测试预约，选择“无预约”可清除当前预约。</div><div class="test-appointment-list">${appointmentRows}</div></div><div class="info-block" style="margin-top:10px"><strong>工作微信状态</strong><div class="tiny muted">设为“已添加”后，可直接进入对应联系人的微信对话并测试 Emoji 和预设表情包。</div><div class="test-wechat-list">${MockData.npcs.map(person=>`<div class="test-wechat-row"><label for="test-wechat-${person.id}">${esc(person.name)}</label><select id="test-wechat-${person.id}" data-test-wechat="${person.id}">${statusOptions(state.wechat[person.id]||'')}</select></div>`).join('')}</div></div>`,`<button class="btn" data-modal-close>取消</button><button class="btn btn-primary" id="apply-test-controls">应用测试值</button>`);
 document.getElementById('apply-test-controls').onclick=applyTestControls;
 document.querySelectorAll('[data-test-npc-enable]').forEach(toggle=>toggle.addEventListener('change',()=>document.querySelectorAll(`[data-test-npc="${toggle.dataset.testNpcEnable}"]`).forEach(input=>{input.disabled=!toggle.checked})));
 document.querySelectorAll('[data-test-appointment-enable]').forEach(toggle=>toggle.addEventListener('change',()=>document.querySelectorAll(`[data-test-appointment="${toggle.dataset.testAppointmentEnable}"] [data-test-appointment-field]`).forEach(input=>{input.disabled=!toggle.checked})));
}
async function applyTestControls(){
 const phase=clampTestInteger(document.getElementById('test-phase')?.value,1,5,state.phase);
 const actionPoints=clampTestInteger(document.getElementById('test-action-points')?.value,0,999,state.actionPoints);
 const totalSpent=clampTestInteger(document.getElementById('test-total-spent')?.value,0,9999,state.totalSpent);
 const enabledNpcIds=new Set([...document.querySelectorAll('[data-test-npc-enable]:checked')].map(toggle=>toggle.dataset.testNpcEnable));
 const adjustments=MockData.npcs.filter(person=>enabledNpcIds.has(person.id)).map(person=>({
  npcId:person.id,
  support:clampTestInteger(document.querySelector(`[data-test-npc="${person.id}"][data-test-field="support"]`)?.value,0,100,state.npcTestStates[person.id]?.support??0),
  pleasantness:clampTestInteger(document.querySelector(`[data-test-npc="${person.id}"][data-test-field="pleasantness"]`)?.value,0,100,state.npcTestStates[person.id]?.pleasantness??50),
  effectiveContactCount:clampTestInteger(document.querySelector(`[data-test-npc="${person.id}"][data-test-field="effectiveContactCount"]`)?.value,0,100,state.npcTestStates[person.id]?.effectiveContactCount??0)
 }));
 const enabledAppointmentIds=new Set([...document.querySelectorAll('[data-test-appointment-enable]:checked')].map(toggle=>toggle.dataset.testAppointmentEnable));
 const appointmentAdjustments=MockData.npcs.filter(person=>enabledAppointmentIds.has(person.id)).map(person=>{
  const current=state.appointments.find(item=>item.npcId===person.id),field=name=>document.querySelector(`[data-test-appointment="${person.id}"] [data-test-appointment-field="${name}"]`)?.value;
  const status=field('status');
  const appointmentId=current?.id&&/^[0-9a-f-]{36}$/i.test(current.id)?{appointmentId:current.id}:{};
  return {npcId:person.id,...appointmentId,status:TEST_APPOINTMENT_STATUSES.includes(status)?status:'none',phase:clampTestInteger(field('phase'),1,5,current?.phase??phase),timeWindow:(field('timeWindow')||current?.timeWindow||'待设置时间').trim(),location:(field('location')||current?.location||'待设置地点').trim(),agenda:(field('agenda')||current?.agenda||'待设置议题').trim()};
 });
 const action=adjustments.length?'test_adjust_npcs':'test_adjust_appointments';
 const response=adjustments.length||appointmentAdjustments.length?await apiCall(action,{...(adjustments.length?{adjustments}:{}),...(appointmentAdjustments.length?{appointments:appointmentAdjustments}:{}),phase}):{npcTestStates:[]};
 if(!response)return;
 state.phase=phase;state.actionPoints=actionPoints;state.totalSpent=totalSpent;
 (response.npcTestStates||[]).forEach(item=>{if(npcIds.has(item.npcId))state.npcTestStates[item.npcId]={support:item.support,pleasantness:item.pleasantness,effectiveContactCount:item.effectiveContactCount,node:item.node}});
 if(Array.isArray(response.appointments))state.appointments=normalizeAppointments(response.appointments);
 const allowedWechatStatuses=new Set(['','accepted','pending','rejected']);
 document.querySelectorAll('[data-test-wechat]').forEach(select=>{
  const id=select.dataset.testWechat,value=allowedWechatStatuses.has(select.value)?select.value:'';
  if(npcIds.has(id)){if(value)state.wechat[id]=value;else delete state.wechat[id]}
 });
 save();closeModal();render();toast('测试数值、NPC 状态与微信状态已更新','success');
}

async function handleAction(e){
 const a=e.currentTarget.dataset.action;
 if(requestBusy&&a!=='refresh-preview'){toast('AI 正在处理中，请稍候。','warn');return}
 if(a==='select-project')document.querySelector('.project-detail')?.scrollIntoView({behavior:'smooth'});
 if(a==='mode')patch({playMode:e.currentTarget.dataset.mode});
 if(a==='start'){if(state.playMode==='multiplayer'){toast('多人模式当前只保留入口','warn');return}patch({screen:'game'})}
 if(a==='test-controls')return openTestControls();
 if(a==='reset')openConfirm('重置预览','会清除浏览器本地的 v10 演示进度，并重置服务端预览会话。',()=>resetPreview());
 if(a==='refresh-preview')return refreshPreview();
 if(a==='retry-ai')return retryAiRequest();
 if(a==='analyze-global-plan')return analyzePlan('global');
 if(a==='analyze-npc-plan')return analyzePlan('npc');
 if(a==='research')return research();
 if(a==='back-global')return backToGlobalPlan();
 if(a==='send-message')return sendMessage();
 if(a==='request-wechat')return requestWechat();
 if(a==='send-postal')return sendPostal();
 if(a==='call')return callNpc();
 if(a==='phone-say')return phoneSay();
 if(a==='end-call'){state.phoneActive=false;save();render()}
 if(a==='direct-visit-confirm')return directVisitConfirm();
 if(a==='save-visit-prep')return saveVisitPrep();
 if(a==='skip-visit-prep')return startVisitSimulation({skipPreparation:true});
 if(a==='visit-sim')return startVisitSimulation();
 if(a==='visit-brief'){state.workspaceMode='briefVisit';save();render()}
 if(a==='submit-brief-visit')return submitBriefVisit();
 if(a==='meeting-send')return meetingSend();
 if(a==='end-visit')return endVisit();
 if(a==='overview'){state.workspaceMode='overview';save();render()}
 if(a==='end-phase')return showEndPhase();
 if(a==='submit')return showSubmission();
 if(a==='restart'){state=initialState();state.screen='game';save();render()}
 if(a==='back-projects'){state=initialState();save();render()}
}
function openModal(title,body,footer='<button class="btn btn-primary" data-modal-close>知道了</button>'){modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="modal-close" data-modal-close>×</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div></div>`;modalRoot.querySelectorAll('[data-modal-close]').forEach(x=>x.onclick=closeModal);modalRoot.querySelector('.modal-backdrop')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()})}
function closeModal(){modalRoot.innerHTML=''}
function openConfirm(title,text,fn){openModal(title,`<div class="notice red">${text}</div>`,`<button class="btn" data-modal-close>取消</button><button class="btn btn-danger" id="generic-confirm">确认</button>`);document.getElementById('generic-confirm').onclick=fn}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape' && closeExpressionPanels()){
   e.preventDefault();
   return;
 }
 if(e.key==='Escape' && state.screen==='game' && state.selectedNpcId && !modalRoot.innerHTML){
   backToGlobalPlan();
 }
});
render();
void loadImageAssets();
})();
