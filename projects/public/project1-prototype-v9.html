<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目一 · 单单位内部竞标 · 交互原型 v10</title>
<meta name="description" content="项目一销售攻关实训预览：NPC 对话、邀约和拜访使用真实 AI；预览会话暂不写入正式存档。">
<style>
:root{
  --bg:#eff3f9;--card:#ffffff;--text:#17223a;--muted:#68758c;--line:#dbe4f0;
  --blue:#2f6bff;--blue-deep:#2258dd;--cyan:#0ea5d9;--green:#15966f;--amber:#df9416;--red:#d94c60;
  --violet:#7b4bea;--gold:#d9951a;
  --glow-blue:rgba(47,107,255,.25);--glow-gold:rgba(223,148,22,.3);
  --shadow:0 10px 30px rgba(24,43,77,.08);--shadow-lg:0 18px 50px rgba(24,43,77,.13);
  --r:16px;--ease:cubic-bezier(.22,.9,.28,1);--spring:cubic-bezier(.34,1.56,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(1100px 520px at 12% -6%,rgba(47,107,255,.075),transparent 60%),
radial-gradient(900px 480px at 96% 6%,rgba(123,75,234,.055),transparent 55%),
radial-gradient(760px 440px at 50% 110%,rgba(14,165,217,.05),transparent 62%),
linear-gradient(180deg,#f5f8fd,#eef2f9 46%,#ebf0f8)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
::selection{background:rgba(47,107,255,.2)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#c3d1e6;border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#a9bcd8;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
.app{min-height:100vh;animation:pageIn .5s var(--ease) both}.shell{max-width:1680px;margin:auto;min-height:100vh}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateX(26px) scale(.95)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.08)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes floatFade{0%{opacity:0;transform:translateY(6px)}18%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
@keyframes apFlash{0%{box-shadow:0 0 0 0 var(--glow-gold)}100%{box-shadow:0 0 0 16px transparent}}

.topbar{height:68px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid rgba(214,226,242,.95);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:30;box-shadow:0 10px 26px rgba(30,47,77,.05)}
.brand{display:flex;gap:11px;align-items:center;min-width:360px}
.brand-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,#4f8dff 0%,#2b64ec 58%,#2250c8 100%);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 7px 18px rgba(47,107,255,.32),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(20,50,120,.35);transition:.3s var(--spring);position:relative;overflow:hidden}
.brand:hover .brand-icon{transform:translateY(-1px) rotate(-3deg) scale(1.04);box-shadow:0 10px 24px rgba(47,107,255,.42),inset 0 1px 0 rgba(255,255,255,.4)}
.brand h1{margin:0;font-size:16px;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:10px;color:var(--muted);letter-spacing:.08em}
.stage-pill{margin:auto;display:flex;align-items:center;gap:11px;padding:9px 15px;border:1px solid #dbe5f2;border-radius:12px;background:linear-gradient(180deg,#fdfefe,#f6f9fd);font-size:11px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 5px 16px rgba(24,43,77,.07)}
.stage-pill .phase-dots{display:inline-flex;gap:4px;margin-right:2px}
.stage-pill .pdot{width:7px;height:7px;border-radius:50%;background:#ccd9ec;transition:.3s var(--ease)}
.stage-pill .pdot.done{background:#2b64ec;box-shadow:0 0 5px rgba(47,107,255,.45)}
.stage-pill .pdot.cur{background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.55);animation:pulseDot 2.2s ease-in-out infinite}
.stage-pill .sep{width:1px;height:16px;background:#dfe7f2}
.stage-pill .ap{color:#a06a10;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;background:linear-gradient(180deg,#fff8e8,#fdf0cf);border:1px solid rgba(223,148,22,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.stage-pill .ap strong{font-size:13px;color:#8a5a08}
.ap.spent-flash{animation:apFlash .6s ease-out}
.float-ap{position:fixed;z-index:300;font-size:13px;font-weight:900;color:#c07f10;pointer-events:none;animation:floatFade 1s var(--ease) both;text-shadow:0 1px 0 rgba(255,255,255,.8),0 0 12px rgba(245,185,66,.45)}
.top-actions{min-width:360px;display:flex;justify-content:flex-end;gap:8px}
.btn{position:relative;overflow:hidden;border:1px solid #d5deeb;background:linear-gradient(180deg,#ffffff,#f5f8fc);color:var(--text);border-radius:10px;padding:9px 13px;font-size:11px;font-weight:800;transition:.22s var(--ease);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(24,43,77,.05)}
.btn:before{content:"";position:absolute;top:0;left:0;width:46%;height:100%;background:linear-gradient(105deg,transparent,rgba(47,107,255,.12),transparent);transform:translateX(-130%) skewX(-18deg);transition:none}
.btn:hover:not([disabled]){border-color:#b9cbe6;background:#fff;transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 7px 16px rgba(28,54,102,.1)}
.btn:hover:not([disabled]):before{animation:sheen .7s var(--ease)}
.btn:active:not([disabled]){transform:translateY(0) scale(.97)}
.btn-primary{background:linear-gradient(180deg,#4080ff 0%,#2b64ee 60%,#2355d6 100%);border-color:#2b64ee;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(15,40,110,.25),0 7px 18px rgba(47,107,255,.32)}
.btn-primary:hover:not([disabled]){background:linear-gradient(180deg,#4a86ff,#2f69f2 60%,#2658dc);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 4px rgba(15,40,110,.25),0 10px 24px rgba(47,107,255,.42)}
.btn-violet{background:linear-gradient(180deg,#906bf5,#6d3fe0);border-color:#6d3fe0;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -2px 4px rgba(60,25,140,.3),0 7px 18px rgba(109,63,224,.35)}
.btn-green{background:linear-gradient(180deg,#27bd88,#12996b);border-color:#12996b;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -2px 4px rgba(10,80,55,.3),0 7px 18px rgba(18,153,107,.32)}
.btn-danger{color:var(--red);border-color:#ffd3da;background:#fff5f7}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:saturate(.4)}
.btn-sm{padding:6px 9px;font-size:9px}
.view{padding:20px}
.card{position:relative;background:linear-gradient(180deg,#ffffff,#fbfdff);border:1px solid #e0e8f2;border-radius:var(--r);box-shadow:0 4px 16px rgba(20,40,80,.05),inset 0 1px 0 rgba(255,255,255,.9);transition:.25s var(--ease)}
.card:hover{border-color:#ccd9ec;box-shadow:0 12px 30px rgba(20,40,80,.09),inset 0 1px 0 rgba(255,255,255,.9)}
.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
.muted{color:var(--muted)}.tiny{font-size:9px}.small{font-size:11px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:8px;font-weight:800;background:#f1f5fa;color:#586a85;border:1px solid #e2eaf4}
.tag.blue{background:#eaf2ff;color:#2c5cd0;border-color:#d3e2fc}
.tag.green{background:#e6f8f1;color:#0f7a59;border-color:#c8ecdf}
.tag.amber{background:#fff5dd;color:#99650d;border-color:#f7e3b4}
.notice{border:1px solid #d8e4f6;background:#f4f8fe;color:#41547a;border-radius:10px;padding:10px 12px;font-size:10px;line-height:1.6}
.notice.amber{border-color:#f2d694;background:#fff9ea;color:#7d5715}
.notice.green{border-color:#bde5d6;background:#effaf6;color:#14664e}
.notice.red{border-color:#f9cbd3;background:#fff3f6;color:#96354a}

/* project entry */
.project-select{max-width:1260px;margin:auto;padding:24px 0 48px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px}
.hero h2{font-size:28px;margin:5px 0 8px;background:linear-gradient(92deg,#1b2a47 35%,#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;max-width:760px;font-size:12px;line-height:1.75;color:var(--muted)}
.prototype-badge{border:1px solid #cfdcf4;background:linear-gradient(180deg,#ffffff,#f2f6ff);color:#2c5cd0;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:800;box-shadow:0 5px 16px rgba(47,107,255,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.project-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.project-card{padding:17px;min-height:184px;position:relative;overflow:hidden;animation:panelIn .5s var(--ease) both}
.project-card:nth-child(2){animation-delay:.05s}.project-card:nth-child(3){animation-delay:.1s}.project-card:nth-child(4){animation-delay:.15s}
.project-card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,#2f6bff,transparent);opacity:0;transition:.3s var(--ease)}
.project-card:not(.disabled):hover{transform:translateY(-4px);border-color:#c6d6ee}
.project-card:not(.disabled):hover:before{opacity:1}
.project-card.disabled{opacity:.55;filter:saturate(.35)}
.project-card .tag{position:absolute;right:13px;top:13px}
.project-card h3{font-size:16px;margin:12px 0 6px}
.project-card .budget{font-size:24px;font-weight:900;margin-top:16px;color:#b97a10}
.project-detail{display:grid;grid-template-columns:1.08fr .92fr;gap:14px;margin-top:15px}
.project-main,.project-side{padding:21px}.project-main h3{font-size:20px;margin:6px 0 11px}
.split-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.info-block{background:#f7fafd;border:1px solid #e9eff7;border-radius:11px;padding:12px}
.info-block strong{font-size:11px;display:block;margin-bottom:6px;color:#33445f}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:9px;padding:5px 8px;border:1px solid #dbe4f0;border-radius:999px;background:#fff;color:#52627c;transition:.2s var(--ease)}
.chip:hover{border-color:#aec4e6;color:#2c5cd0;background:#f4f8ff}
.mode-tabs{display:flex;gap:7px;margin:14px 0}
.mode{flex:1;text-align:left;border:1px solid #dde6f1;border-radius:10px;background:#fff;padding:11px;color:var(--text);transition:.22s var(--ease)}
.mode:hover{border-color:#bccfe9;transform:translateY(-1px)}
.mode.active{border-color:#8fb2ff;background:linear-gradient(180deg,#f3f7ff,#e9f0ff);box-shadow:0 0 0 1px #c4d7ff,0 8px 20px rgba(47,107,255,.14),inset 0 1px 0 #fff}
.mode strong{display:block;font-size:11px}.mode span{display:block;font-size:9px;color:var(--muted);margin-top:3px}

/* game */
.workspace{display:grid;grid-template-columns:280px 390px minmax(0,1fr);gap:14px;height:calc(100vh - 108px);min-height:680px}.workspace>*>*{animation:panelIn .42s var(--ease) both}
.context-col,.people-col,.comm-col{min-height:0}.context-col{display:flex;flex-direction:column;gap:11px}
.context-card{padding:15px}.context-card h3,.people-head h3{font-size:14px;margin:0}.context-card p{font-size:10px;line-height:1.65;color:var(--muted)}
.budget-box{background:linear-gradient(135deg,#fdf6e4,#fbf0d2);border:1px solid #f0dcae;border-radius:10px;padding:11px;margin:11px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.budget-box label{font-size:9px;color:#a97e2c}.budget-box strong{display:block;font-size:23px;margin-top:2px;color:#a06a10}
.goal-box{border:1px solid #f0d28d;background:linear-gradient(160deg,#fff8e6,#fffdf4);border-radius:10px;padding:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 14px rgba(180,130,30,.09)}
.goal-box span{font-size:9px;font-weight:900;color:#956612;letter-spacing:.06em}.goal-box strong{display:block;font-size:13px;margin:6px 0}
.info-update{padding:14px}.info-update-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.info-update-head strong{font-size:12px}
.update-list{display:flex;flex-direction:column;gap:7px;max-height:182px;overflow:auto}
.update-item{border-left:2px solid #7fa4f5;padding:5px 7px 5px 10px;border-radius:0 8px 8px 0;background:linear-gradient(90deg,rgba(47,107,255,.08),rgba(47,107,255,0));animation:fadeSlide .32s var(--ease) both}
.update-item b{display:block;font-size:9px;color:#3c62b8}.update-item span{display:block;font-size:8px;color:#75839c;line-height:1.5;margin-top:2px}
.nav-card{padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.nav-card strong{font-size:11px}.nav-card span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.people-col{display:flex;flex-direction:column;background:linear-gradient(180deg,#ffffff,#fafcfe);border:1px solid #e0e8f2;border-radius:var(--r);overflow:hidden;box-shadow:0 10px 30px rgba(20,40,80,.07)}
.people-head{padding:15px 17px 12px;border-bottom:1px solid #e7edf6;background:linear-gradient(180deg,#f6f9ff,#fff)}.people-head p{font-size:9px;color:var(--muted);margin:4px 0 0}
.org-wrap{flex:1;overflow:auto;padding:16px;background:
radial-gradient(circle at 50% 4%,rgba(47,107,255,.05),transparent 34%),
radial-gradient(circle at 82% 60%,rgba(123,75,234,.03),transparent 30%),
linear-gradient(#fcfdff,#fff)}
.org-caption{font-size:8px;color:#93a1b8;text-align:center;margin-bottom:10px}
.org-tree{display:flex;flex-direction:column;align-items:center;min-width:340px;padding-bottom:20px}
.org-level{display:flex;justify-content:center;gap:15px;width:100%;position:relative}
.org-connector-v{width:1px;height:18px;background:#ccd7e7}
.org-branch{width:72%;height:16px;border-top:1px solid #ccd7e7;position:relative}
.org-branch:before,.org-branch:after{content:"";position:absolute;top:-1px;height:16px;border-left:1px solid #ccd7e7}
.org-branch:before{left:12%}.org-branch:after{right:12%}
.person-node{width:164px;border:1px solid #e2e9f3;background:linear-gradient(180deg,#ffffff,#fbfdff);border-radius:13px;padding:10px;text-align:left;color:var(--text);position:relative;box-shadow:0 3px 10px rgba(24,44,84,.06),inset 0 1px 0 #fff;transition:.25s var(--spring)}
.person-node:before{content:"";position:absolute;inset:0;border-radius:13px;background:radial-gradient(120px 44px at 18% 0%,rgba(47,107,255,.09),transparent 70%);opacity:0;transition:.28s var(--ease)}
.person-node:hover{border-color:#bccfef;transform:translateY(-2px);box-shadow:0 9px 20px rgba(24,44,84,.11)}
.person-node:hover:before{opacity:1}
.person-node.active{border-color:#7fa4f5;background:linear-gradient(180deg,#f4f8ff,#ebf2ff);box-shadow:0 0 0 2px rgba(47,107,255,.14),0 10px 24px rgba(47,107,255,.16);transform:translateY(-1px)}
.person-node.active:before{opacity:1}
.person-head{display:grid;grid-template-columns:36px 1fr;gap:9px;align-items:center}
.person-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#f0f4fa,#e2eaf4);color:#5a6c88;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 4px rgba(120,145,185,.25);transition:.28s var(--spring)}
.person-node.active .person-avatar{background:linear-gradient(145deg,#4f8dff,#2b62e8);color:#fff;box-shadow:0 0 12px rgba(47,107,255,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.person-name{font-size:11px;font-weight:900}.person-role{font-size:8px;color:var(--muted);margin-top:2px}
.person-status{font-size:8px;color:#8a99b2;margin-top:5px}
.intel-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.intel-chip{font-size:7.5px;line-height:1.35;color:#2f56a8;background:linear-gradient(180deg,#f0f6ff,#e7efff);border:1px solid #d5e3fd;border-radius:7px;padding:4px 5px;animation:fadeSlide .3s var(--ease) both}
.intel-more{font-size:7px;color:#8491a3}
.org-actions{padding:11px 13px;border-top:1px solid #e7edf6;background:#f9fbfd;display:flex;align-items:center;justify-content:space-between;gap:8px}.org-actions span{font-size:8px;color:var(--muted)}
.comm-col{display:flex;flex-direction:column;background:linear-gradient(180deg,#ffffff,#fafcfe);border:1px solid #e0e8f2;border-radius:var(--r);overflow:hidden;box-shadow:0 14px 34px rgba(20,40,80,.08)}
.contact-detail{height:75px;padding:12px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #e7edf6;background:linear-gradient(90deg,rgba(47,107,255,.07),transparent 55%)}
.contact-detail .person-avatar{width:42px;height:42px;background:linear-gradient(145deg,#4f8dff,#2b62e8);color:#fff;box-shadow:0 0 14px rgba(47,107,255,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.contact-detail h3{font-size:16px;margin:0}.contact-detail p{font-size:9px;color:var(--muted);margin:3px 0 0}.detail-meta{margin-left:auto;display:flex;gap:6px;align-items:center}
.back-global-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #dbe3ef;background:#fff;color:#52627c;border-radius:10px;padding:7px 9px;font-size:8.5px;font-weight:800;transition:.22s var(--ease);white-space:nowrap}
.back-global-btn:hover{border-color:#aec4e6;background:#f4f8ff;color:#2f5bb0;transform:translateX(-2px);box-shadow:0 6px 14px rgba(29,56,104,.09)}
.back-global-btn:active{transform:translateX(0) scale(.98)}
.back-global-btn .arrow{font-size:13px;line-height:1;margin-top:-1px}
.action-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px 14px;border-bottom:1px solid #e7edf6;background:linear-gradient(180deg,#fdfefe,#f8fafd)}
.action-btn{border:1px solid #dde6f1;background:linear-gradient(180deg,#ffffff,#f7fafd);border-radius:10px;padding:8px 5px;text-align:center;color:#5a6c88;font-size:9px;font-weight:800;transition:.22s var(--spring);box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(24,44,84,.05)}
.action-btn:hover{border-color:#b7cbe9;color:#2c5cd0;transform:translateY(-2px);box-shadow:0 7px 15px rgba(28,54,102,.11),inset 0 1px 0 #fff}
.action-btn:active{transform:scale(.96)}
.action-btn.active{border-color:#7fa4f5;background:linear-gradient(180deg,#f0f5ff,#e7efff);color:#2c5cd0;box-shadow:0 0 0 2px rgba(47,107,255,.13),0 7px 18px rgba(47,107,255,.16),inset 0 1px 0 #fff}
.plan-panel{padding:12px 14px;border-bottom:1px solid #e7edf6;background:linear-gradient(180deg,#fbfdff,#f7fafe)}
.plan-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.plan-title strong{font-size:10px}.plan-title span{font-size:8px;color:var(--muted)}
.plan-row{display:flex;gap:8px}
.plan-row textarea{flex:1;min-height:58px;resize:vertical;border:1px solid #dbe4f0;border-radius:10px;padding:9px 10px;font-size:10px;line-height:1.55;outline:none;background:#fbfcfe;color:var(--text);transition:.22s var(--ease)}
.plan-row textarea:hover{border-color:#c2d3ec;background:#fff}
.plan-row textarea:focus{border-color:#7fa4f5;background:#fff;box-shadow:0 0 0 4px rgba(47,107,255,.12)}
.plan-result{margin-top:8px;border:1px solid #bde5d6;background:#effaf6;border-radius:9px;padding:8px 9px;font-size:9px;line-height:1.55;color:#14664e}
.plan-result.warn{border-color:#f0cf87;background:#fff9eb;color:#835b18}
.workspace-body{flex:1;min-height:0;overflow:auto;background:
radial-gradient(circle at 70% 0%,rgba(47,107,255,.05),transparent 28%),
radial-gradient(circle at 20% 90%,rgba(123,75,234,.03),transparent 30%),
linear-gradient(180deg,#f6f9fd,#f2f6fa);padding:14px}.workspace-body>*{animation:panelIn .3s var(--ease) both}
.empty-main{height:100%;min-height:510px;display:grid;place-items:center}
.empty-main-inner{max-width:650px;width:100%;text-align:center}

async function apiCall(action,payload={}){

 state.aiStatus='AI 思考中…';state.aiError='';state.aiErrorCanRefresh=false;save();render();
 try{
  const token=getSessionToken();
  if(!token)throw {status:401};
  const commandId=globalThis.crypto?.randomUUID?.()||`preview-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const request={action,commandId,...payload};
  if(state.previewSessionId)request.previewSessionId=state.previewSessionId;
  if(Number.isFinite(state.previewVersion))request.expectedVersion=state.previewVersion;
  const response=await fetch('/api/project-one-preview/ai',{
   method:'POST',credentials:'same-origin',
   headers:{'content-type':'application/json','x-session':token},
   body:JSON.stringify(request)
  });
  let body={};try{body=await response.json()}catch{}
  if(body?.previewSessionId)state.previewSessionId=body.previewSessionId;
  if(Number.isFinite(body?.version))state.previewVersion=body.version;
  if(Number.isFinite(body?.data?.version))state.previewVersion=body.data.version;
  if(!response.ok||body?.success===false)throw {status:response.status,message:body?.error||body?.message};
  if(body?.previewSessionId)state.previewSessionId=body.previewSessionId;
  return body?.data||{};
 }catch(error){

}

function bind(){
 document.querySelectorAll('[data-action]').forEach(e=>e.addEventListener('click',handleAction));
 document.querySelectorAll('[data-select-npc]').forEach(e=>e.addEventListener('click',()=>selectNpc(e.dataset.selectNpc)));
 document.querySelectorAll('[data-workspace]').forEach(e=>e.addEventListener('click',()=>chooseWorkspace(e.dataset.workspace)));
 if(state.screen==='result'){
  const el=document.querySelector('.score-box strong');
  if(el){const target=parseInt(el.textContent,10)||0,t0=performance.now();
   const tick=t=>{const k=Math.min(1,(t-t0)/900),ease=1-Math.pow(1-k,3);
    el.textContent=Math.round(target*ease);if(k<1)requestAnimationFrame(tick)};
   el.textContent='0';requestAnimationFrame(tick)}
 }
 const gp=document.getElementById('global-plan');
 if(gp)gp.addEventListener('input',()=>{state.workPlans.global=gp.value;save()});
 const np=document.getElementById('npc-plan');
 if(np)np.addEventListener('input',()=>{if(state.selectedNpcId){state.workPlans.byNpc[state.selectedNpcId]=np.value;save()}});
 const at=document.getElementById('attachment-text');
 if(at)at.addEventListener('input',updateMessageCost);
 updateMessageCost();

function chooseWorkspace(mode){
 if(mode==='visit'){
   state.phoneActive=false;
   if(!hasInvite(state.selectedNpcId)&&!hasDirectVisitIntent(state.selectedNpcId)){state.workspaceMode='visit';save();render();return directVisitConfirm()}
   if(!state.visitPreparations[state.selectedNpcId]){state.workspaceMode='visitPrep';save();render();return}
   state.workspaceMode='visit';save();render();return
 }
 state.workspaceMode=mode;state.channel=mode;state.phoneActive=false;save();render();
}
async function analyzePlan(scope){
 const id=scope==='global'?null:state.selectedNpcId;
 const el=document.getElementById(scope==='global'?'global-plan':'npc-plan'),text=el?.value.trim()||'';
 if(!text){toast('工作计划可以不填；如果要提交，请先输入一些内容。','warn');return}
 if(scope==='global')state.workPlans.global=text;else state.workPlans.byNpc[id]=text;

 const rawRes=await apiCall('plan',{npcId:id||undefined,text,phase:state.phase});
 const res=rawRes?{...rawRes,revealDetails:rawRes.disclosed||[],matched:(rawRes.matchedNpcIds||[]).map(npcId=>({npcId,name:npc(npcId)?.name||npcId,matchedKeywords:[]}))}:null;
 if(!res){render();return}

 // 内容过于简单：只提示细化，不扣点，也不给引导问题。
 if(res.needsDetail){
   if(scope==='global')state.planAnalysis.global=res;else state.planAnalysis.byNpc[id]=res;
   save();render();toast('计划描述过于简单，请进一步细化。','warn');return;
 }

 // 同一份完全相同的有效计划重复查看，不重复扣点。
 const previous=scope==='global'?state.submittedPlans.global:state.submittedPlans.byNpc[id];
 const isRepeat=previous===text;
 if(!isRepeat && !spend(1,'提交工作计划'))return;

 const disclosed=[];
 (res.revealDetails||[]).forEach(d=>{
   const target=npc(d.npcId);
   if(!target)return;
   const candidates=[...(d.facts||[]),...(d.clues||[]).map(clue=>`线索：${clue}`)];
   const current=state.publicIntel[d.npcId]||[];
   const newly=candidates.filter(item=>!current.includes(item));
   if(newly.length){
     state.publicIntel[d.npcId]=[...current,...newly];
     disclosed.push({npcId:d.npcId,name:target.name,facts:newly});
     newly.forEach(item=>addUpdate(`工作计划触发信息披露：获得 ${target.name} 的人物信息——${item}`));
   }
 });

 const result={...res,disclosed,charged:!isRepeat};
 if(scope==='global'){
   state.planAnalysis.global=result;
   state.submittedPlans.global=text;
 }else{
   state.planAnalysis.byNpc[id]=result;
   state.submittedPlans.byNpc[id]=text;
 }
 save();render();

 if(disclosed.length){
   const names=[...new Set(disclosed.map(d=>d.name))];
   openModal(
     '信息披露',
     `<div class="notice green">已获得新的可披露人物信息。</div>
      <div class="info-block" style="margin-top:10px">
        <strong>已更新人物</strong>
        <div class="small muted">${names.map(n=>esc(n)).join('、')}</div>
      </div>
      <div class="tiny muted" style="margin-top:10px;line-height:1.6">具体信息已同步到人物结构图，请到对应联系人节点查看。</div>`
   );
 } else {
   toast(`计划已记录${isRepeat?'（未重复扣点）':'，消耗 1 行动点'}`,'success');
 }
}
async function research(){
 const n=npc();if(!n||!spend(2,'搜索公开信息'))return;
 toast('正在搜索公开信息…');const data=await DemoOnlyApi.researchPublicInfo(n);
 const old=state.publicIntel[n.id]||[];state.publicIntel[n.id]=[...new Set([...old,...data.facts])];
 addUpdate(`获得 ${n.name} 的公开信息 ${data.facts.length} 条，已显示在人物结构图旁。`);
 save();render();openModal(`${n.name} · 公开信息`,`<div class="notice">来源：${esc(data.source)}。这些只是公开可获得的信息，不代表隐藏态度。</div>${data.facts.map(x=>`<div class="info-block" style="margin-top:8px">${esc(x)}</div>`).join('')}<div class="notice amber" style="margin-top:8px"><strong>可匹配线索</strong><br>${data.clues.map(x=>esc(x)).join('<br>')}<br><span class="tiny">线索只有在工作计划关键词命中时才会持续写入人物信息。</span></div>`);
}
function formatAttachment(description,result){
 if(!description)return null;
 if(result?.viewed===true)return `${description} · 对方已查看${result.impact?`；影响：${result.impact}`:''}`;
 if(result?.viewed===false)return `${description} · 对方未查看`;
 return description;
}
function applyInvitationResult(n,data){
 if(data?.appointment)upsertAppointment({...data.appointment,status:data.invitationStatus||'accepted'},n.id);
 if(!data?.invitationStatus)return;
 if(data.invitationStatus==='accepted'&&data.appointment){
  addUpdate(`${n.name} 已接受邀约。可以进入拜访准备。`);
  openModal('邀约已接受',`<div class="notice green">服务端预览会话确认 ${n.name} 已接受本阶段拜访邀约。</div><div class="info-block" style="margin-top:10px"><strong>下一步</strong><div class="small muted">建议先简述你准备如何开展这次拜访，再选择实际模拟或简述拜访方案。</div></div>`,`<button class="btn" data-modal-close>稍后准备</button><button class="btn btn-primary" id="go-prep">进入准备</button>`);
  document.getElementById('go-prep').onclick=()=>{closeModal();state.workspaceMode='visitPrep';save();render()};
 }else if(data.invitationStatus!=='accepted')toast(`邀约结果：${data.invitationStatus}`,'warn');
}
async function sendMessage(){
 const n=npc(),ch=state.workspaceMode;if(!['email','wechat'].includes(ch))return;
 const text=document.getElementById('message-text')?.value.trim()||'',att=document.getElementById('attachment-text')?.value.trim()||'';
 if(!text){toast('先输入要发送的内容','warn');return}
 const cost=1+(att?1:0);if(!canAfford(cost,`${channelLabel(ch)}发送`))return;
 const res=await apiCall('message',{npcId:n.id,channel:ch,text,attachment:att?{title:'附件说明',content:att}:undefined,phase:state.phase});
 if(!res){render();return}
 spend(cost,`${channelLabel(ch)}发送`);
 const arr=state.conversations[n.id][ch];arr.push({role:'player',channel:channelLabel(ch),text,attachment:formatAttachment(att,res.attachment)});
 if(res.content)arr.push({role:'npc',channel:channelLabel(ch),text:res.content});
 applyInvitationResult(n,res);addUpdate(`${n.name} 已处理你的${channelLabel(ch)}。`);save();render();toast(`${channelLabel(ch)}已发送，消耗 ${cost} 行动点`,'success');
}
async function requestWechat(){
 const n=npc(),reason=document.getElementById('wechat-reason')?.value.trim()||'';
 if(reason.length<8){toast('请用自然语言说明添加工作微信的原因','warn');return}
 if(!canAfford(1,'申请工作微信'))return;
 const res=await apiCall('wechat_request',{npcId:n.id,text:reason,phase:state.phase});
 if(!res){render();return}
 spend(1,'申请工作微信');
 const status=res.wechatStatus||res.status||(res.wechatAccepted===true?'accepted':res.wechatAccepted===false?'rejected':'pending');
 state.wechat[n.id]=status;
 if(res.content)state.conversations[n.id].wechat.push({role:'npc',channel:'微信',text:res.content});
 applyInvitationResult(n,res);addUpdate(`${n.name} 已处理工作微信申请。`);save();render();toast(status==='accepted'?'工作微信申请已通过':'工作微信申请结果已返回',status==='accepted'?'success':'warn')
}
function directVisitConfirm(){
 const n=npc();
 openModal('未进行邀约',`<div class="notice amber">您未进行邀约，是否选择直接登门拜访 ${n.name}？</div><div class="small muted" style="margin-top:10px;line-height:1.7">这只记录你的意图；开始拜访时由服务端预览会话决定是否允许进入。</div>`,`<button class="btn" data-modal-close>取消</button><button class="btn btn-primary" id="confirm-door">选择直接登门</button>`);
 document.getElementById('confirm-door').onclick=()=>{closeModal();state.directVisitIntent[n.id]=true;addUpdate(`你选择尝试直接登门拜访 ${n.name}，等待服务端判断。`);state.workspaceMode='visitPrep';save();render()}
}
async function saveVisitPrep(){
 const n=npc(),text=document.getElementById('visit-prep-text')?.value.trim()||'';if(text.length<12){toast('请至少简述一下拜访准备，再继续。','warn');return}
 const feedback=await apiCall('visit_preparation',{npcId:n.id,text,phase:state.phase});
 if(!feedback){render();return}
 state.visitPreparationFeedback[n.id]=feedback;
 const adequate=feedback.needsDetail!==true;
 if(adequate)state.visitPreparations[n.id]=text;
 save();render();
 const summary=feedback.summary||feedback.content||feedback.nextStep||'服务端已完成本次拜访准备评估。';
 const strengths=Array.isArray(feedback.strengths)&&feedback.strengths.length?`<div class="analysis-box" style="margin-top:10px"><strong>准备充分之处</strong><ul>${feedback.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
 const risks=Array.isArray(feedback.risks)&&feedback.risks.length?`<div class="analysis-box" style="margin-top:10px"><strong>仍需注意</strong><ul>${feedback.risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
 if(!adequate){
  openModal('拜访准备需要完善',`<div class="notice amber">${esc(summary)}</div>${strengths}${risks}`,`<button class="btn btn-primary" data-modal-close>继续完善准备</button>`);
  toast('请根据反馈完善拜访准备后再继续。','warn');return;
 }
 openModal('拜访准备反馈',`<div class="notice">${esc(summary)}</div>${strengths}${risks}`,`<button class="btn btn-primary" id="continue-prep">继续选择拜访方式</button>`);
 document.getElementById('continue-prep').onclick=()=>{closeModal();state.workspaceMode='visit';save();render()};
}
async function startVisitSimulation(){
 const n=npc(),appt=state.appointments.find(a=>a.npcId===n.id&&a.status==='accepted');
 if(!appt&&!hasDirectVisitIntent(n.id)){toast('当前没有可执行的拜访','warn');return}
 if(!canAfford(3,'实际拜访'))return;
 const res=await apiCall('start_visit',{npcId:n.id,phase:state.phase});
 if(!res){render();return}
 const remote=res.meeting;
 if(!remote){state.aiError='服务端未返回会面状态，请重试。';save();render();return}
 if(remote.meetingEnded){return finishVisitFromServer({...res,...remote})}
 spend(3,'实际拜访');
 state.meeting={npcId:n.id,appointmentId:appt?.id||null,location:appt?.location||'客户单位',turn:Number(remote.turn||0),completedTasks:Array.isArray(remote.completedTasks)?remote.completedTasks:[]};
 if(res.content)state.conversations[n.id].meeting.push({role:'npc',channel:'拜访',text:res.content,taskType:res.taskType||null});
 save();render();toast('已进入真实AI拜访模拟','success')
}
async function submitBriefVisit(){
 const n=npc(),text=document.getElementById('brief-visit-text')?.value.trim()||'';if(text.length<30){toast('拜访方案过于简单，请再细化一些。','warn');return}
 if(!canAfford(2,'简述拜访方案'))return;
 const r=await apiCall('brief_visit',{npcId:n.id,text,phase:state.phase});
 if(!r){render();return}
 spend(2,'简述拜访方案');state.lastBriefResult={summary:r.summary||r.content||r.nextStep||'AI 已完成本次拜访方案评估。',strengths:Array.isArray(r.strengths)?r.strengths:[],risks:Array.isArray(r.risks)?r.risks:[]};state.workspaceMode='briefResult';state.completedVisits.push({npcId:n.id,type:'brief',phase:state.phase});if(r.appointment)upsertAppointment(r.appointment,n.id);addUpdate(`已获得与 ${n.name} 的真实 AI 拜访方案评估。`);save();render();toast('AI 拜访方案评估已完成','success')
}
async function sendPostal(){
 const n=npc(),text=document.getElementById('postal-text')?.value.trim()||'';if(text.length<8){toast('请描述要邮寄的材料','warn');return}
 if(!spend(2,'邮寄材料'))return;
 const item=await DemoOnlyApi.sendPostal({npcId:n.id,text,phase:state.phase});state.postal.push(item);state.conversations[n.id].postal.push({role:'player',channel:'邮寄',text});addUpdate(`已向 ${n.name} 邮寄材料：${text.slice(0,24)}${text.length>24?'…':''}`);save();render();toast('邮寄前端结果样例已创建（2 行动点）','success')
}
async function callNpc(){
 const n=npc();if(!canAfford(1,'拨打电话'))return;
 const res=await apiCall('phone_connect',{npcId:n.id,text:'玩家拨打工作电话，等待接听。',phase:state.phase});
 if(!res){render();return}
 spend(1,'拨打电话');state.phoneAttempts[n.id]=(state.phoneAttempts[n.id]||0)+1;state.phoneActive=res.connected!==false;
 if(res.content)state.conversations[n.id].work_phone.push({role:'npc',channel:'电话',text:res.content});
 applyInvitationResult(n,res);addUpdate(`${n.name} 已处理本次电话连接。`);save();render();toast(state.phoneActive?'电话已接通':'电话未接通',state.phoneActive?'success':'warn')
}
async function phoneSay(){
 const n=npc(),text=document.getElementById('phone-text')?.value.trim()||'';if(!text)return;
 const res=await apiCall('message',{npcId:n.id,channel:'work_phone',text,phase:state.phase});
 if(!res){render();return}
 const arr=state.conversations[n.id].work_phone;arr.push({role:'player',channel:'电话',text});if(res.content)arr.push({role:'npc',channel:'电话',text:res.content});applyInvitationResult(n,res);save();render()
}
async function meetingSend(){
 const m=state.meeting,n=npc(m.npcId),text=document.getElementById('meeting-input')?.value.trim()||'';if(!text)return;
 const res=await apiCall('visit_turn',{npcId:n.id,text,phase:state.phase});
 if(!res){render();return}
 const arr=state.conversations[n.id].meeting;arr.push({role:'player',channel:'拜访',text});if(res.content)arr.push({role:'npc',channel:'拜访',text:res.content,taskType:res.taskType||null});
 const remote=res.meeting;
 if(!remote){state.aiError='服务端未返回会面状态，请重试。';save();render();return}
 m.turn=Number(remote.turn??m.turn??0);m.completedTasks=Array.isArray(remote.completedTasks)?remote.completedTasks:(m.completedTasks||[]);
 if(remote.meetingEnded)return finishVisitFromServer({...res,...remote});
 save();render();
}
function endReasonLabel(endReason){
 const labels={npc_task_completed:'NPC已完成本次任务（提问 / 质疑 / 挖坑）',turn_limit:'对话轮次已超过20轮',player_farewell:'玩家主动提出告辞'};
 return labels[endReason]||'本次拜访已由服务端结束';
}
function finishVisitFromServer(result){
 const m=state.meeting;if(!m)return;
 const endReason=result.endReason||'player_farewell',turn=Number(result.turn??m.turn??0),completedTasks=Array.isArray(result.completedTasks)?result.completedTasks:(m.completedTasks||[]);
 const n=npc(m.npcId),appt=state.appointments.find(a=>a.id===m.appointmentId);if(result.appointment)upsertAppointment(result.appointment,n.id);else if(appt)appt.status='completed';
 state.completedVisits.push({npcId:n.id,type:'simulated',phase:state.phase,endReason,turns:turn,completedTasks:[...completedTasks]});
 state.meeting=null;state.workspaceMode='overview';addUpdate(`已完成与 ${n.name} 的实际拜访模拟：${endReasonLabel(endReason)}。`);save();render();
 openModal('拜访结束',`<div class="notice green">${esc(endReasonLabel(endReason))}</div><div class="small muted" style="margin-top:10px">本次共进行 ${turn} 轮对话。</div>`,`<button class="btn btn-primary" data-modal-close>确认</button>`);toast('拜访已结束','success')
}
async function endVisit(){
 const m=state.meeting;if(!m)return;
 const n=npc(m.npcId),res=await apiCall('end_visit',{npcId:n.id,phase:state.phase});
 if(!res){render();return}
 if(res.content)state.conversations[n.id].meeting.push({role:'npc',channel:'拜访',text:res.content,taskType:res.taskType||null});
 const remote=res.meeting;
 if(!remote){state.aiError='服务端未返回会面状态，请重试。';save();render();return}
 m.turn=Number(remote.turn??m.turn??0);m.completedTasks=Array.isArray(remote.completedTasks)?remote.completedTasks:(m.completedTasks||[]);
 if(remote.meetingEnded!==false)return finishVisitFromServer({...res,...remote});
 save();render();toast('服务端尚未结束本次拜访，请继续沟通或稍后重试。','warn')
}
function showEndPhase(){
 if(state.phase===5)return showSubmission();
 const open=state.appointments.filter(a=>a.status==='accepted');
 openModal(`结束第 ${state.phase} 阶段`,`<div class="notice amber">结束阶段前请检查未完成事项。</div><div class="check-list"><div class="check-item"><span>当前无进行中的拜访</span><span class="${!state.meeting?'ok':'warn'}">${!state.meeting?'✓ 已处理':'! 请注意'}</span></div><div class="check-item"><span>已邀约但未完成的拜访</span><span class="${open.length?'warn':'ok'}">${open.length?`! ${open.length} 项`:'✓ 已处理'}</span></div><div class="check-item"><span>当前行动点</span><strong>${state.actionPoints}</strong></div></div>`,`<button class="btn" data-modal-close>取消</button><button class="btn btn-primary" id="next-phase">确认进入下一阶段</button>`);
 document.getElementById('next-phase').onclick=advancePhase
}
function advancePhase(){
 state.phase+=1;state.actionPoints=Math.min(28,state.actionPoints+8);state.selectedNpcId=null;state.workspaceMode='overview';state.phoneActive=false;if(state.phase>=3&&state.competitorEventsSeen.length<MockData.competitorEvents.length)state.competitorEventsSeen.push(MockData.competitorEvents[state.competitorEventsSeen.length]);addUpdate(`已进入第 ${state.phase} 阶段 · ${phaseMeta().name}。`);save();closeModal();render();toast('已进入下一阶段','success')
}
function showSubmission(){
 const contacted=MockData.npcs.filter(n=>Object.values(state.conversations[n.id]).some(a=>a.length)).length,visits=state.completedVisits.length,plans=(state.workPlans.global?1:0)+Object.values(state.workPlans.byNpc).filter(Boolean).length;
 openModal('项目提交检查',`${state.phase<5?'<div class="notice red">当前未到第 5 阶段；原型仍允许查看提交体验。</div>':'<div class="notice green">已进入最终阶段。</div>'}<div class="check-list"><div class="check-item"><span>已形成沟通记录的联系人</span><strong>${contacted} / ${MockData.npcs.length}</strong></div><div class="check-item"><span>已完成拜访 / 拜访方案</span><strong>${visits} 次</strong></div><div class="check-item"><span>已输入并分析的工作计划</span><strong>${plans} 份</strong></div><div class="check-item"><span>已获得公开信息的人物</span><strong>${Object.entries(state.publicIntel).filter(([id,items])=>npcIds.has(id)&&items.length).length} 人</strong></div><div class="check-item"><span>累计消耗行动点</span><strong>${state.totalSpent}</strong></div></div>`,`<button class="btn" data-modal-close>继续行动</button><button class="btn btn-primary" id="confirm-submit">确认提交项目</button>`);
 document.getElementById('confirm-submit').onclick=submitProject
}
async function submitProject(){const r=await DemoOnlyApi.submitProject();state.result=r;state.screen='result';save();closeModal();render();toast('前端结果样例已生成','success')}
async function resetPreview(){
 const res=await apiCall('reset',{});
 if(!res){render();return}
 const next=initialState();
 next.previewSessionId=state.previewSessionId;next.previewVersion=state.previewVersion;
 state=next;save();closeModal();render();toast('预览会话与本地演示进度已重置','success')
}
function refreshPreview(){clearAiRuntimeState();window.location.reload()}

async function handleAction(e){
 const a=e.currentTarget.dataset.action;
 if(requestBusy&&a!=='refresh-preview'){toast('AI 正在处理中，请稍候。','warn');return}
 if(a==='select-project')document.querySelector('.project-detail')?.scrollIntoView({behavior:'smooth'});
 if(a==='mode')patch({playMode:e.currentTarget.dataset.mode});
 if(a==='start'){if(state.playMode==='multiplayer'){toast('多人模式当前只保留入口','warn');return}patch({screen:'game'})}
 if(a==='reset')openConfirm('重置预览','会清除浏览器本地的 v10 演示进度，并重置服务端预览会话。',()=>resetPreview());
 if(a==='refresh-preview')return refreshPreview();
 if(a==='analyze-global-plan')return analyzePlan('global');
 if(a==='analyze-npc-plan')return analyzePlan('npc');
 if(a==='research')return research();
 if(a==='back-global')return backToGlobalPlan();
 if(a==='send-message')return sendMessage();
 if(a==='request-wechat')return requestWechat();
 if(a==='send-postal')return sendPostal();
 if(a==='call')return callNpc();
 if(a==='phone-say')return phoneSay();
 if(a==='end-call'){state.phoneActive=false;save();render()}
 if(a==='direct-visit-confirm')return directVisitConfirm();
 if(a==='save-visit-prep')return saveVisitPrep();
 if(a==='visit-sim')return startVisitSimulation();
 if(a==='visit-brief'){state.workspaceMode='briefVisit';save();render()}
 if(a==='submit-brief-visit')return submitBriefVisit();
 if(a==='meeting-send')return meetingSend();
 if(a==='end-visit')return endVisit();
 if(a==='overview'){state.workspaceMode='overview';save();render()}
 if(a==='end-phase')return showEndPhase();
 if(a==='submit')return showSubmission();
 if(a==='restart'){state=initialState();state.screen='game';save();render()}
 if(a==='back-projects'){state=initialState();save();render()}
}
function openModal(title,body,footer='<button class="btn btn-primary" data-modal-close>知道了</button>'){modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="modal-close" data-modal-close>×</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div></div>`;modalRoot.querySelectorAll('[data-modal-close]').forEach(x=>x.onclick=closeModal);modalRoot.querySelector('.modal-backdrop')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()})}
function closeModal(){modalRoot.innerHTML=''}
function openConfirm(title,text,fn){openModal(title,`<div class="notice red">${text}</div>`,`<button class="btn" data-modal-close>取消</button><button class="btn btn-danger" id="generic-confirm">确认</button>`);document.getElementById('generic-confirm').onclick=fn}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape' && state.screen==='game' && state.selectedNpcId && !modalRoot.innerHTML){
   backToGlobalPlan();
 }
});
render();
})();
</script>
</body>
</html>
